global_rules:
  - "stratum_access_expected concerns whether the designated source class/search route should be accessible enough to execute the rule; it does not mean favorable evidence is expected if the proposition is true."
  - "probative_absence_expectation is a separate prospective rule. No unlisted absence may be made probative after exposure."
  - "NO_PROBATIVE_ABSENCE_BY_DEFAULT means absence alone cannot support a rival; ordinary weak/neutral search results receive proposition dispositions rather than ISS."
  - "A proposition may route to MISSING_CRITICAL_EVIDENCE/ISS only through access/provenance/coverage failure in a designated required stratum with no adequate substitute, never because the searched evidence is merely unfavorable."
