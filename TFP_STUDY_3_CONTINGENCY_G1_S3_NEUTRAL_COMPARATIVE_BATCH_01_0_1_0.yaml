neutral_sources:
  - source_id: "S3N-001"
    identity: "Stanford Encyclopedia of Philosophy, 'Principle of Sufficient Reason,' substantive revision 2023."
    stable_url: "https://plato.stanford.edu/entries/sufficient-reason/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-BRUTE","C-GLOBAL-DEFLATION","C-NECESSITARIAN","BG-PSR-SCOPE","BG-EXPLANATORY-REALISM"]
    map_check: "Confirms that PSR has multiple strengths and that rejection of brute facts depends on which explanatory relation/scope is intended; prevents treating one PSR formulation as the sole rationalist option."

  - source_id: "S3N-002"
    identity: "Stanford Encyclopedia of Philosophy, 'Cosmological Argument,' substantive revision 2026."
    stable_url: "https://plato.stanford.edu/entries/cosmological-argument/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-BRUTE","C-REGRESS","C-GLOBAL-DEFLATION","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-CONCRETE","C-NEC-IMPERSONAL-PRINCIPLE"]
    map_check: "Surveys contingency arguments, brute-universe replies, regress/complete-explanation issues, necessary-being conclusions, and the separate step from necessary cause to personal explanation. Reinforces the frozen rule that necessary foundation does not entail agency."

  - source_id: "S3N-003"
    identity: "Stanford Encyclopedia of Philosophy, 'Fundamentality,' 2022-2024 editions."
    stable_url: "https://plato.stanford.edu/entries/fundamentality/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-REGRESS","C-HOLISTIC","C-NEC-IMPERSONAL-CONCRETE","BG-DEPENDENCE-STRUCTURE","BG-GROUND-CATEGORY"]
    map_check: "Distinguishes metaphysical foundationalism, infinitism, coherentism, and multiple strengths of well-foundedness; prevents collapsing any infinite descent into the denial of all foundations or equating set-theoretic well-foundedness with every metaphysical foundation claim."

  - source_id: "S3N-004"
    identity: "Stanford Encyclopedia of Philosophy, 'Metaphysical Explanation,' substantive revision 2026."
    stable_url: "https://plato.stanford.edu/entries/metaphysical-explanation/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-HOLISTIC","C-SELF-EXPLANATORY","C-GLOBAL-DEFLATION","C-NEC-IMPERSONAL-CONCRETE","C-NEC-IMPERSONAL-PRINCIPLE","BG-EXPLANATION-RELATION","BG-GROUND-CATEGORY"]
    map_check: "Surveys pluralism about metaphysical explanation and alternative models (grounding, quasi-causal, nomological, unificationist, pragmatic), guarding against silent grounding-monism."

  - source_id: "S3N-005"
    identity: "Stanford Encyclopedia of Philosophy, 'The Epistemology of Modality,' substantive revision 2023."
    stable_url: "https://plato.stanford.edu/entries/modality-epistemology/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-MODAL-DISSOLUTION","C-INDETERMINATE-ULTIMACY","C-NECESSITARIAN","C-INDEXICAL-PLURALITY","BG-MODAL-STATUS","BG-MODAL-LOGIC"]
    map_check: "Separates logical, physical/nomic, epistemic, and metaphysical modality and surveys competing epistemologies of modal knowledge; directly supports the frozen no-substitution rule without selecting a modal theory as true."

  - source_id: "S3N-006"
    identity: "Stanford Encyclopedia of Philosophy, 'Possible Worlds.'"
    stable_url: "https://plato.stanford.edu/entries/possible-worlds/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-MODAL-DISSOLUTION","C-NECESSITARIAN","C-INDEXICAL-PLURALITY","BG-ACTUALITY-PRIVILEGE","BG-MODAL-STATUS"]
    map_check: "Distinguishes Lewisian concretism/indexical actuality from abstractionist, combinatorial, actualist, and other possible-world frameworks; prevents equating possible-world semantics with Lewisian ontology."

  - source_id: "S3N-007"
    identity: "Stanford Encyclopedia of Philosophy, 'Possible Objects' and Possibilism-Actualism supplement."
    stable_url: "https://plato.stanford.edu/entries/possible-objects/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-INDEXICAL-PLURALITY","BG-ACTUALITY-PRIVILEGE"]
    map_check: "Clarifies Lewis's indexical theory of actuality and how it differs from generic possibilism/actualism, preventing IP from being treated as any use of possible worlds."

  - source_id: "S3N-008"
    identity: "Stanford Encyclopedia of Philosophy, 'Structural Realism.'"
    stable_url: "https://plato.stanford.edu/entries/structural-realism/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-NEC-IMPERSONAL-PRINCIPLE","C-NEC-IMPERSONAL-CONCRETE","BG-ABSTRACT-PRINCIPLE-FORCE","BG-ONTOLOGY-ADMISSIBILITY"]
    map_check: "Maps multiple forms of ontic structural realism rather than a single 'structure-only' thesis; prevents a critique of eliminative OSR from being generalized to every structural/principle candidate."

  - source_id: "S3N-009"
    identity: "Stanford Encyclopedia of Philosophy, 'Process Theism.'"
    stable_url: "https://plato.stanford.edu/entries/process-theism/"
    access_status: "FULL_TEXT_OR_SUBSTANTIAL_HTML_READ"
    map_targets: ["C-NEC-AGENTIVE","BG-AGENTIVE-MODAL-LINK"]
    map_check: "Shows a necessary-agent tradition in which necessary existence coexists with contingent divine actuality and explicitly non-classical attributes, confirming that necessary agency must not be sourced as classical/Abrahamic theism by default."

  - source_id: "S3N-010"
    identity: "Elly Vintiadis and Constantinos Mekios (eds.), Brute Facts, Oxford University Press, 2018."
    stable_identifier: "DOI:10.1093/oso/9780198758600.001.0001"
    stable_url: "https://academic.oup.com/book/7173"
    access_status: "ABSTRACT_OR_SUBSTANTIAL_EXCERPT_READ"
    map_targets: ["C-BRUTE","C-GLOBAL-DEFLATION","BG-PSR-SCOPE","BG-EXPLANATORY-REALISM"]
    map_check: "Treats brute facts as a broad research category across metaphysics and philosophy of science, including distinctions among kinds of brute fact; guards against reducing BR to mere present ignorance or one physics-specific subvariant."

  - source_id: "S3N-011"
    identity: "W. J. Mander, 'The Axiarchic Argument,' in Idealist Ethics, Oxford University Press, 2016."
    stable_identifier: "DOI:10.1093/acprof:oso/9780198748892.003.0007"
    stable_url: "https://academic.oup.com/book/6341/chapter-abstract/150056784"
    access_status: "ABSTRACT_OR_SUBSTANTIAL_EXCERPT_READ"
    map_targets: ["C-AXIARCHIC","C-NEC-IMPERSONAL-PRINCIPLE","BG-AXIOLOGICAL-FORCE"]
    map_check: "Comparatively presents Leslie/Rescher-style value-to-existence explanation and objections, confirming axiarchism is a distinct evaluative explanatory mechanism rather than merely generic impersonal law or disguised agency."

  - source_id: "S3N-012"
    identity: "Oxford Studies in Metaphysics 6, 'Metaphysical Vagueness' symposium (Barnes & Williams; Eklund; response), 2011."
    stable_url: "https://academic.oup.com/book/12009"
    access_status: "ABSTRACT_OR_SUBSTANTIAL_EXCERPT_READ"
    map_targets: ["C-INDETERMINATE-ULTIMACY","C-MODAL-DISSOLUTION","BG-METAPHYSICAL-INDETERMINACY"]
    map_check: "Presents theory, critique, and response in one scholarly forum, helping separate intelligibility of metaphysical indeterminacy from its truth and from semantic/epistemic vagueness."

