native_formulation: "Jesus was crucified and died. One or more actors necessary to the founding proclamation knowingly asserted or constructed an origin-material resurrection/encounter claim they understood to be materially false, with the intention or accepted effect that the movement receive it as true. M-FOUNDING-FAB was PRIMARY. The strongest historical form includes deliberate body removal or concealment plus knowingly false resurrection proclamation, but F does not require a tomb/body-removal mechanism unless that subroute is explicitly supported."

