    use: "FORMULATION_ONLY__HISTORICAL_PROPONENT"
    contribution: "Historical explicit deception model in which disciples could remove Jesus's body and knowingly proclaim resurrection."
  - id: "FORM-F-002"
    title: "Albert Schweitzer — Quest of the Historical Jesus, ch. 2 on Reimarus"
    use: "FORMULATION_ONLY__SECONDARY_PROVENANCE"
    contribution: "Confirms the structure and historical seriousness of Reimarus's theory while also making clear that it is a specific historical theory rather than a default skeptical assumption."

