source_clusters:
  C1_PAULINE_FOUNDING:
    source_ids: ["G1W1-001","G1W1-002","G1W1-003","G1W1-004","G1W1-005","G1W1-016","G1W1-017","G1W1-018","G1W1-034","G1W1-050"]
    observations:
      - "1 Corinthians 15:1-11 contains received/delivered death, burial, raised, and appearance claims; the precise pre-Pauline formula boundary remains disputed."
      - "1 Corinthians 9:1 and Galatians 1-2 provide Paul's own encounter/apostolic-contact claims; exact chronology and independence implications remain source-critical questions."
      - "1 Corinthians 15:35-54 and 2 Corinthians 5:1-10 contain outcome-material body/dwelling language without a G1 metaphysical interpretation."
      - "Romans 1:3-4, Philippians 2:6-11, and 1 Thessalonians 4:13-18 provide early proclamation/eschatological language but do not automatically resolve occurrence or ontology."
    limits:
      - "Formula boundaries, chronology, and semantic interpretation require the SRC-02 controls below."
      - "Paul is one author stream; repeated Pauline passages are not independent votes."
  C2_CANONICAL_NARRATIVE:
    source_ids: ["G1W1-006","G1W1-007","G1W1-015","G1W1-019","G1W1-020","G1W1-021"]
    observations:
      - "Mark 15:33-16:8, Matthew 27-28, Luke 23-24, and John 19-21 preserve passion/burial/empty-tomb/appearance narrative material with materially different details."
      - "The longer ending of Mark is separately controlled as a textual-critical issue rather than silently merged with Mark 16:1-8."
    limits:
      - "Narrative multiplicity does not equal independent eyewitness multiplicity."
      - "Synoptic/Johannine dependence and dating remain explicit controls."
  C3_ACTS_TRANSMISSION:
    source_ids: ["G1W1-022","G1W1-023","G1W1-024","G1W1-025","G1W1-031"]
    observations:
      - "Acts preserves multiple resurrection/death proclamation speeches and named witness claims."
      - "Speech-source scholarship is represented as a dispute; the speeches are not treated as verbatim early transcripts without source-critical warrant."
    limits:
      - "Acts is a later literary source relative to the founding period and cannot automatically establish independent founding streams."
  C4_NONCANONICAL_RECEPTION:
    source_ids: ["G1RS-053","G1RS-054","G1RS-070"]
    observations:
      - "Ignatius, 1 Clement, Polycarp, and Didache document early reception of resurrection claims."
      - "The Akhmim Gospel of Peter fragment supplies a later noncanonical passion-resurrection narrative with distinctive elaboration."
    limits:
      - "E5 applies: later reception may preserve, reinterpret, or develop earlier material and is not projected backward without a transmission argument."
      - "Gospel of Peter identity/date and canonical dependence remain disputed."
  C5_JEWISH_CONCEPTUAL_CONTEXT:
    source_ids: ["G1W1-013","G1W1-014","G1W1-028","G1W1-029","G1W1-038","G1W1-039","G1W1-040","G1W1-044","G1W1-045","G1W1-046","G1W1-047"]
    observations:
      - "The acquired Jewish corpus contains multiple resurrection, re-embodiment, immortality, afterlife, and vindication patterns rather than one uniform semantic model."
      - "Josephus afterlife terminology has an explicit modern interpretive dispute represented by Yli-Karjanmaa and Klawans."
    limits:
      - "Conceptual availability is not occurrence evidence."
      - "Klawans full chapter remains inaccessible; several ancient texts remain translation-level rather than critical-apparatus acquisitions."
  C6_EXTERNAL_NOTICES:
    source_ids: ["G1W1-009","G1W1-010","G1W1-011","G1W1-041","G1W1-048","G1W1-051","G1W1-052"]
    observations:
      - "Tacitus, Josephus, Pliny, Suetonius, Lucian, and Mara provide varying external or cross-tradition historical/reception context."
      - "Pliny is early-second-century evidence for Christian practice, not an independent resurrection-appearance report."
      - "Suetonius and Mara remain identity/date-ambiguous controls."
    limits:
      - "The Testimonium Flavianum transmission dispute is explicit."
      - "Later notices do not become first-generation event evidence by repetition."
  C7_ADVERSE_HISTORIOGRAPHY:
    source_ids: ["G1W1-049","G1RS-071","G1RS-072","G1RS-073"]
    observations:
      - "Crossan's corrected burial/nonburial argument is represented at the key page-specific claims and tied to his Gospel-of-Peter development argument."
      - "Luedemann and Goulder are identified as serious vision/psychological adverse formulations."
    limits:
      - "Crossan pp.123-158 was not read continuously."
      - "Luedemann and Goulder full arguments remain unread after legitimate full-text access failures."
      - "Their conclusions are not adopted as L1 findings."
  C8_SOURCE_CRITICAL_CONTROLS:
    source_ids: ["G1W1-008","G1W1-030","G1W1-031","G1W1-032","G1W1-033","G1W1-035"]
    observations:
      - "The corpus explicitly represents disputes over 1 Corinthians 15 formula boundaries, Synoptic dependence, Acts speech sources, Johannine dependence/composition, Pauline chronology, and resurrection-body semantics."
    limits:
      - "Most of these controls are abstract/excerpt/reference-entry level rather than full-monograph or full-article evaluation."
      - "The second Reviewer C coverage report judged that limitation non-outcome-changing for STUDY-scope coverage; proposition-level sufficiency still requires scoped review."

