gate_controls:
  MOD-DEFLATIONARY:
    source_dimension: "BG-MODAL-STATUS"
    activation: "When MOD-DEFLATIONARY is selected."
    rule: "Test dissolution/indeterminacy boundary first; lower-order existence joints are idle unless the modal premise survives as truth-apt."
    affected: ["C-MODAL-DISSOLUTION","C-INDETERMINATE-ULTIMACY","all lower-order existence-sensitive candidates"]
  BG-TEMPORAL-ORIGIN-LINK:
    activation: "Only when a truth-critical inference uses temporal origin/beginning."
    rule: "Temporal origin cannot enter as a contingency premise unless independently licensed."
    full_cartesian_factor: false
  BG-MODAL-LOGIC:
    activation: "Only when a truth-critical inference uses possibility-to-necessity."
    rule: "Run S5 versus weaker/unfixed logic only on that inference."
    full_cartesian_factor: false

