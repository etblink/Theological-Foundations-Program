material_pairs:
  - id: "INT-ER-PSR"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-PSR-SCOPE"]
    rationale: "Whether a PSR-like demand is an objective metaphysical requirement or a weaker explanatory norm changes stopping burdens."
    affected: ["BR-N4","RG-N5","GD-N2","GD-N3","necessary-ground stopping claims"]
  - id: "INT-ER-TOTALITY"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-TOTALITY-EXPLANANDUM"]
    rationale: "A totality-level object creates a distinct burden only if the relevant explanation can apply objectively at that level."
    affected: ["BR-N2","RG-N4","GD-N2","GD-N3"]
  - id: "INT-PSR-TOTALITY"
    dimensions: ["BG-PSR-SCOPE","BG-TOTALITY-EXPLANANDUM"]
    rationale: "PSR strength and totality status jointly determine whether local/member explanations leave an additional stopping burden."
    affected: ["BR-N4","RG-N4","RG-N5","GD-N2","GD-N3"]
  - id: "INT-ER-DEPENDENCE"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-DEPENDENCE-STRUCTURE"]
    rationale: "Structural completion constraints matter differently under robust, pluralist, and deflationary explanation."
    affected: ["RG-N3","RG-N5","HO-N2","HO-N5","SE-N2"]
  - id: "INT-PSR-DEPENDENCE"
    dimensions: ["BG-PSR-SCOPE","BG-DEPENDENCE-STRUCTURE"]
    rationale: "Whether regress, holistic completion, or reflexive completion is adequate depends jointly on demanded stopping strength."
    affected: ["RG-N5","HO-N5","SE-N5"]
  - id: "INT-ER-ABSTRACT"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-ABSTRACT-PRINCIPLE-FORCE"]
    rationale: "Whether abstract/principle facts count as genuine explanation depends on both explanatory realism and abstract force."
    affected: ["PR-N2","PR-N3"]
  - id: "INT-ER-AGENT"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-AGENTIVE-MODAL-LINK"]
    rationale: "Agentive explanation as ultimate explanation depends on explanatory realism and the necessary-source/contingent-output link."
    affected: ["AG-N3","AG-N4"]
  - id: "INT-ER-AXIOLOGY"
    dimensions: ["BG-EXPLANATORY-REALISM","BG-AXIOLOGICAL-FORCE"]
    rationale: "A value-to-being explanation requires both a truth-bearing explanatory relation and value capable of occupying it."
    affected: ["AX-N2","AX-N4"]
  - id: "INT-ABSTRACT-AXIOLOGY"
    dimensions: ["BG-ABSTRACT-PRINCIPLE-FORCE","BG-AXIOLOGICAL-FORCE"]
    rationale: "Value/principle explanation depends on the explanatory status of abstract/principle facts and the role of evaluative requiredness."
    affected: ["AX-N2","AX-N4","PR-N7"]
  - id: "INT-MODALSTATUS-INDETERMINACY"
    dimensions: ["BG-MODAL-STATUS","BG-METAPHYSICAL-INDETERMINACY"]
    rationale: "Modal deflation/epistemic readings must be separated from genuine worldly indeterminacy."
    affected: ["MD-N2","IU-N2","IU-N3"]
  - id: "INT-MODALSTATUS-AGENT"
    dimensions: ["BG-MODAL-STATUS","BG-AGENTIVE-MODAL-LINK"]
    rationale: "The necessary-agent-to-contingent-output question depends on both modal status and the agentive modal link."
    affected: ["AG-N1","AG-N4"]
  - id: "INT-MODALSTATUS-ABSTRACT"
    dimensions: ["BG-MODAL-STATUS","BG-ABSTRACT-PRINCIPLE-FORCE"]
    rationale: "Necessary principle/constraint explanations depend on the status of metaphysical modality and abstract/principle force."
    affected: ["PR-N1","PR-N3","PR-N5"]
  - id: "INT-TOTALITY-DEPENDENCE"
    dimensions: ["BG-TOTALITY-EXPLANANDUM","BG-DEPENDENCE-STRUCTURE"]
    rationale: "Regress and holistic completion interact with whether a totality is distinct, locally exhausted, or indeterminate as a totality."
    affected: ["RG-N4","RG-N5","HO-N5"]
  - id: "INT-PSR-ABSTRACT"
    dimensions: ["BG-PSR-SCOPE","BG-ABSTRACT-PRINCIPLE-FORCE"]
    rationale: "Whether an abstract/principle explanation can satisfy the demanded explanation depends jointly on PSR scope and principle force."
    affected: ["PR-N2","PR-N3","BR-N4"]
  - id: "INT-TOTALITY-ACTUALITY"
    dimensions: ["BG-TOTALITY-EXPLANANDUM","BG-ACTUALITY-PRIVILEGE"]
    rationale: "Totality status and actuality privilege jointly matter for the indexical-plurality boundary."
    affected: ["IP-N3","IP-N4","IP-N5"]
  - id: "INT-MODALSTATUS-IMPERSONAL-LINK"
    dimensions: ["BG-MODAL-STATUS","BG-IMPERSONAL-GROUNDING-MODAL-LINK"]
    rationale: "Whether a necessary impersonal ground preserves genuine metaphysical contingency depends jointly on the status of modality and the ground-to-output necessity-transmission rule."
    affected: ["IC-N5","PR-N6","AX-N5"]
  - id: "INT-RELATION-IMPERSONAL-LINK"
    dimensions: ["BG-EXPLANATION-RELATION","BG-IMPERSONAL-GROUNDING-MODAL-LINK"]
    rationale: "Necessity transmission can depend on which truth-relevant impersonal explanatory relation is actually invoked; relation admissibility and modal transmission cannot be collapsed."
    affected: ["IC-N5","PR-N6","AX-N5"]
  - id: "INT-ABSTRACT-IMPERSONAL-LINK"
    dimensions: ["BG-ABSTRACT-PRINCIPLE-FORCE","BG-IMPERSONAL-GROUNDING-MODAL-LINK"]
    rationale: "For principle routes, abstract explanatory force and the modal behavior of the successful impersonal link jointly control contingency preservation."
    affected: ["PR-N6","AX-N5"]
  - id: "INT-AXIOLOGY-IMPERSONAL-LINK"
    dimensions: ["BG-AXIOLOGICAL-FORCE","BG-IMPERSONAL-GROUNDING-MODAL-LINK"]
    rationale: "Axiarchic adequacy depends both on value having ontic explanatory force and on that non-agentive explanatory link not automatically necessitating the explanandum."
    affected: ["AX-N5"]
  - id: "INT-CATEGORY-IMPERSONAL-LINK"
    dimensions: ["BG-GROUND-CATEGORY","BG-IMPERSONAL-GROUNDING-MODAL-LINK"]
    rationale: "Concrete versus non-concrete ground eligibility and the modal behavior of the successful impersonal link jointly affect which family can preserve a genuinely contingent explanandum."
    affected: ["IC-N5","PR-N6","AX-N5"]

