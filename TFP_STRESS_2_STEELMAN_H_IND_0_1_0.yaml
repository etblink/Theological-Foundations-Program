  - "P-HIND-FOUNDING-CAUSAL"

authority_commitments:
  - "Psychological mechanism literature establishes mechanism intelligibility/capacity only; it does not establish that any early Christian report was nonveridical."
  - "A sincere experience is not treated as evidence of veridicality or nonveridicality merely from sincerity."
  - "No mental-disorder diagnosis is required."
  - "No body/tomb proposition is necessary to H-IND."

internal_success_conditions:
  - "At least one founding individual subjective-experience stream is independently supported."
  - "The relevant experience is nonveridical under the study's referent rules."
  - "M-IND-EXP has adequate mechanism capacity and is PRIMARY under the common causal-role ladder."
  - "M-SOC-EXP and M-INTERP are CONTRIBUTING_NONNECESSARY or NONE."
  - "M-FOUNDING-FAB is NONE."
  - "The founding causal bridge does not rely on later narrative elaboration."

expected_evidence:
  - "Founding-stratum testimony consistent with one or more sincere individual postmortem-type experiences."
  - "Phenomenology compatible with known classes of vivid bereavement/anomalous experience without requiring an external referent."
  - "Transmission chronology consistent with an individual experience being upstream of the proclamation."
  - "No independently warranted requirement for social amplification or interpretive processing to generate the founding proclamation."

recognized_objections:
  - "Modern bereavement-experience research may not transfer to first-century persons or to the reported circumstances."
  - "A real external referent would defeat P-HIND-NONVERIDICAL."
  - "Evidence of necessary social amplification routes to H-SEED-SPREAD or C-HET-SEED-SPREAD."
  - "Evidence of necessary founding interpretation routes to a C-HET candidate."
  - "Multiplicity or diversity of founding streams may exceed a single-process H-IND model."

caricatures_rejected:
  - "H-IND is not 'the disciples were crazy'."
  - "H-IND does not require psychopathology, drugs, sleep paralysis, or a single named clinical diagnosis."
  - "H-IND does not treat all later appearance narratives as direct transcripts of one founding experience."
  - "H-IND does not gain support merely because R or V weakens."

