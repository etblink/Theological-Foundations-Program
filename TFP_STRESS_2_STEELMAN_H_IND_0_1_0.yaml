native_formulation: "Jesus was crucified and died. At least one genuine individual subjective postmortem-type experience occurred in the founding stratum without a veridical external Jesus referent. The individual-experience mechanism M-IND-EXP was PRIMARY in generating the founding proclamation; social amplification, interpretive processing, later narrative development and body-disposition considerations may contribute but are not causally necessary at founding. No founding deception is required."

proponent_sources:
  - id: "FORM-H-001"
    title: "Kamp et al. 2020 — Sensory and Quasi-Sensory Experiences of the Deceased in Bereavement"
    use: "FORMULATION_ONLY__MECHANISM"
    contribution: "Establishes a serious phenomenological/mechanism class in which bereaved persons can have vivid sensory or quasi-sensory experiences of deceased persons without the experiences being reducible to pathology."
  - id: "TFP-SYNTHETIC-BOUNDARY"
    title: "Frozen TFP H-IND causal profile"
    use: "INTERNAL_SYNTHETIC_FORMULATION"
    contribution: "No single reviewed scholar is claimed to endorse the exact TFP conjunction; the packet combines a serious individual-experience mechanism with the frozen causal-role and founding-stratum constraints."

necessary_propositions:
  - "P-HIST-JESUS"
  - "P-CRUC"
  - "P-DEATH"
  - "P-EARLY-PROCLAMATION-EXISTENCE"
  - "P-HIND-EXPERIENCE-OCCURRED"
  - "P-HIND-NONVERIDICAL"
