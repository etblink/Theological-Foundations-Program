dependency_semantics:
  arrow_direction: "from -> to"
  relation_classes:
    prerequisite: "The from-node is required for the to-node's scoped application; this does not imply that the from-node establishes the to-node."
    definitional_unpacking: "The to-node states truth conditions already contained in or fixed by the from-node; no independent evidential support is implied."
    necessary_compatibility_condition: "The to-node is independently required for the candidate to remain coherent/adequate with the from-node."
    boundary_condition: "The to-node prevents collapse into another candidate, meta-outcome, or excluded interpretation; it is not inferred merely from the from-node."
    answer_level_condition: "The to-node is independently required for the candidate to supply the frozen Study-3 answer."
    alternative_path: "One admissible implementation path; sibling alternative paths are not conjunctively required."
  default_rule: "No arrow is a demonstrated logical implication unless relation_class is explicitly definitional_unpacking and the truth conditions warrant that reading."

candidates:
  C-BRUTE:
    packet_blob_sha: "0888f048117afed26c95cb9b6b01c177d406bfb2"
    necessary_claims:
      - { id: "BR-N1", claim: "Relevant contingent reality obtains.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "BR-N2", claim: "At least one ultimate contingent fact, totality, or permitted law-governed stopping structure lacks a deeper truth-relevant explanation.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "BR-N3", claim: "The lack of deeper explanation is ontic rather than merely current ignorance.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "BR-N4", claim: "No valid unrestricted explanatory principle that applies to the proposed stopping fact rules out genuine ultimate brute contingency.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary:
      - { id: "BR-S1", claim: "A methodological demand for explanation is not automatically entitled to govern an ultimate stopping fact merely because it governs derivative facts.", types: ["philosophical"] }
    contextual: []
    dependencies:
      - { from: "BR-N1", to: "BR-N2", relation_class: "prerequisite", disposition: "necessary", note: "Scope prerequisite only; contingency does not establish brutality." }
      - { from: "BR-N2", to: "BR-N3", relation_class: "boundary_condition", disposition: "necessary", note: "BR-N3 fixes ontic brutality rather than ignorance; BR-N2 alone does not prove BR-N3." }
      - { from: "BR-N4", to: "BR-N2", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "If an applicable valid principle excludes the stopping fact, the candidate is inadequate." }

  C-REGRESS:
    packet_blob_sha: "8790ba1007037a632a42fbacf723894424b448b6"
    necessary_claims:
      - { id: "RG-N1", claim: "Relevant contingent reality obtains.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "RG-N2", claim: "Every relevant contingent explanandum is explained by further contingent reality.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "RG-N3", claim: "The family-defining dependence structure is one-way and nonterminal rather than cyclic, self-reflexive, or terminating.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "RG-N4", claim: "The regress is not itself reclassified as one unexplained brute totality.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "RG-N5", claim: "Adequate explanation of the relevant chain does not require a metaphysically necessary terminus.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual:
      - { id: "RG-C1", claim: "A merely infinite temporal history is not sufficient to establish this explanatory-regress candidate.", types: ["philosophical","interpretive"] }
    dependencies:
      - { from: "RG-N1", to: "RG-N2", relation_class: "prerequisite", disposition: "necessary", note: "Scope prerequisite only." }
      - { from: "RG-N2", to: "RG-N3", relation_class: "boundary_condition", disposition: "necessary", note: "Further contingent explanation does not by itself establish one-way nontermination." }
      - { from: "RG-N3", to: "RG-N4", relation_class: "boundary_condition", disposition: "necessary", note: "Nontermination alone does not establish that the whole is non-brute." }
      - { from: "RG-N5", to: "RG-N3", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "If adequacy requires a necessary terminus, the nonterminal family fails." }

  C-HOLISTIC:
    packet_blob_sha: "5128dfb29fbbf88eb098e971aec64746ec6f0065"
    necessary_claims:
      - { id: "HO-N1", claim: "Relevant contingent reality obtains.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "HO-N2", claim: "Explanation or grounding need not be well-founded in a terminal base.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "HO-N3", claim: "At least one admissible mutual, structural, cyclic, or otherwise non-reflexive non-well-founded implementation performs genuine explanatory work.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "HO-N4", claim: "No single contingent item or totality explains itself in the family-defining explanatory relation.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "HO-N5", claim: "The explanatory arrangement is not merely an unexplained brute totality.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "HO-N6", claim: "The family-defining explanatory structure is not merely a one-way nonterminating regress.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual: []
    alternative_paths:
      - { id: "HO-P1", description: "mutual/interdependent explanation", disposition: "alternative_path" }
      - { id: "HO-P2", description: "structural/network explanation", disposition: "alternative_path" }
      - { id: "HO-P3", description: "non-vicious cyclic explanation", disposition: "alternative_path" }
      - { id: "HO-P4", description: "other non-reflexive non-well-founded explanation consistent with the frozen family", disposition: "alternative_path" }
    dependencies:
      - { from: "HO-N2", to: "HO-N3", relation_class: "prerequisite", disposition: "necessary", note: "Permission for non-well-founded explanation does not establish that a qualifying structure obtains." }
      - { from: "HO-N3", to: "HO-N4", relation_class: "boundary_condition", disposition: "necessary", note: "Excludes item-reflexive self-explanation." }
      - { from: "HO-N3", to: "HO-N5", relation_class: "answer_level_condition", disposition: "necessary", note: "The arrangement must do more than leave the whole brute." }
      - { from: "HO-N3", to: "HO-N6", relation_class: "boundary_condition", disposition: "necessary", note: "Preserves distinction from C-REGRESS." }

  C-SELF-EXPLANATORY:
    packet_blob_sha: "7b6ffebd9a2a5b625137b928650dbc0ef824c143"
    necessary_claims:
      - { id: "SE-N1", claim: "The ultimate stopping item or totality is genuinely contingent.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "SE-N2", claim: "A genuine item-reflexive explanatory relation obtains for that stopping item or totality.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "SE-N3", claim: "The reflexive relation is not equivalent to brute non-explanation.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "SE-N4", claim: "The successful self-explanation preserves the stopping item's genuine contingency rather than making it metaphysically necessary.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "SE-N5", claim: "The reflexive explanation completes the relevant ultimate stopping role without requiring a distinct metaphysically necessary foundation to complete that same explanation.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual:
      - { id: "SE-C1", claim: "SE-N5 does not deny that necessary entities of some other kind might exist.", types: ["philosophical","interpretive"] }
    dependencies:
      - { from: "SE-N1", to: "SE-N2", relation_class: "prerequisite", disposition: "necessary", note: "Joint candidate commitments; contingency does not imply self-explanation." }
      - { from: "SE-N2", to: "SE-N3", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "Anti-vacuity requirement." }
      - { from: "SE-N1", to: "SE-N4", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "Preserves the candidate's contingent stopping item." }
      - { from: "SE-N2", to: "SE-N5", relation_class: "answer_level_condition", disposition: "necessary", note: "Reflexive explanation must actually fill the ultimate stopping role." }

  C-GLOBAL-DEFLATION:
    packet_blob_sha: "32807841c6805b9d6c8440895457118f10f842a1"
    necessary_claims:
      - { id: "GD-N1", claim: "Relevant local or domain contingency can be genuine.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "GD-N2", claim: "Local explanatory demands do not automatically aggregate into a distinct totality-level explanatory demand.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "GD-N3", claim: "A principled scoped reason supports treating the absence of an additional global ground as non-defective while preserving legitimate local explanation.", types: ["philosophical","metaphysical","interpretive"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary:
      - { id: "GD-S1", claim: "In some admissible implementations, appropriate local/domain explanations may exhaust the legitimate explanatory task.", types: ["philosophical","metaphysical"] }
    contextual: []
    dependencies:
      - { from: "GD-N1", to: "GD-N2", relation_class: "boundary_condition", disposition: "necessary", note: "Preserves ordinary contingency rather than dissolving it." }
      - { from: "GD-N2", to: "GD-N3", relation_class: "answer_level_condition", disposition: "necessary", note: "Non-aggregation alone does not settle every possible global demand; a scoped reason is independently required." }

  C-MODAL-DISSOLUTION:
    packet_blob_sha: "54dbb7733a164899b0ec575ecd673dc17a3b26d6"
    necessary_claims:
      - { id: "MD-N1", claim: "The Study-3 working question relies on at least one central metaphysical-contingency presupposition.", types: ["philosophical","metaphysical","interpretive"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "MD-N2", claim: "That contingency presupposition is not truth-apt or is inapplicable under the correct modal framework.", types: ["philosophical","metaphysical","linguistic"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "MD-N3", claim: "This modal diagnosis is substantive rather than a report of investigator ignorance or abstention.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "MD-N4", claim: "The family-defining dissolution diagnosis is not merely the assertion that total reality is metaphysically necessary.", types: ["philosophical","metaphysical","interpretive"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual:
