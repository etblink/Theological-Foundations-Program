      - { from: "MD-N2", to: "MD-N4", relation_class: "boundary_condition", disposition: "necessary", note: "Excludes mere substitution of necessitarianism." }

  C-INDETERMINATE-ULTIMACY:
    packet_blob_sha: "99b5f62cd33a190c3e2ec081f39de9033d1c3c37"
    necessary_claims:
      - { id: "IU-N1", claim: "The ultimacy question is truth-apt.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IU-N2", claim: "The relevant ultimacy structure itself is genuinely metaphysically indeterminate: there is no unique determinate fact of the matter among the relevant determinate ultimacy alternatives.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IU-N3", claim: "The indeterminacy is worldly/ontic rather than merely linguistic, representational, or epistemic.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IU-N4", claim: "The candidate is not equivalent to Protocol B6 UNDERDETERMINED or investigator abstention.", types: ["philosophical","interpretive"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary:
      - { id: "IU-S1", claim: "A coherent logic/metaphysics can represent determinate claims about where indeterminacy obtains.", types: ["philosophical","metaphysical"] }
    contextual:
      - { id: "IU-C1", claim: "Ordinary coexistence of multiple determinate grounds or a disjunction caused only by ignorance does not satisfy IU-N2.", types: ["philosophical","interpretive"] }
    dependencies:
      - { from: "IU-N1", to: "IU-N2", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "Truth-aptness is jointly required but does not imply indeterminacy." }
      - { from: "IU-N2", to: "IU-N3", relation_class: "boundary_condition", disposition: "necessary", note: "No-unique-answer language alone does not establish ontic location." }
      - { from: "IU-N3", to: "IU-N4", relation_class: "boundary_condition", disposition: "necessary", note: "Distinguishes worldly indeterminacy from study-level underdetermination." }

  C-NECESSITARIAN:
    packet_blob_sha: "0b8a1ac7d79077256a98a188844c97689c52056c"
    scope_definition: "Relevant total reality means the total reality whose obtaining/non-obtaining is at issue in the Study-3 ultimacy question; local or derivative contingency claims are not silently equated with total contingency."
    necessary_claims:
      - { id: "NE-N1", claim: "The relevant total reality exists metaphysically necessarily.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "NE-N2", claim: "There is no metaphysically possible total alternative in which that same scoped total reality fails to obtain.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "NE-N3", claim: "Apparently contingent local, internal, derivative, or indexical features are compatible with the metaphysical necessity of the scoped total structure under the candidate's account.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "NE-N4", claim: "There is no contingent total remainder whose obtaining requires an external selector or ground to explain why this total reality rather than a total alternative obtains.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual:
      - { id: "NE-C1", claim: "NE-N4 does not assert that necessary reality cannot have any explanation of any kind.", types: ["philosophical","interpretive"] }
    dependencies:
      - { from: "NE-N1", to: "NE-N2", relation_class: "definitional_unpacking", disposition: "necessary", note: "Both use the same fixed total-reality scope." }
      - { from: "NE-N1", to: "NE-N3", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "Total necessity does not itself explain ordinary contingency discourse." }
      - { from: "NE-N1", to: "NE-N4", relation_class: "answer_level_condition", disposition: "necessary", note: "The candidate removes a contingent total selection remainder." }

  C-INDEXICAL-PLURALITY:
    packet_blob_sha: "5cb7058b6903d38579fd5ae8dd26a35795c4f75b"
    necessary_claims:
      - { id: "IP-N1", claim: "This locus/world can be genuinely contingent at the indexical level.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IP-N2", claim: "A broader plurality of loci or possibilities exists as the family-defining necessary/non-contingent stopping structure.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IP-N3", claim: "No external selector is needed to make this locus uniquely actual.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IP-N4", claim: "Actuality or its analogue is indexical rather than a metaphysically privileged selection relation.", types: ["philosophical","metaphysical","linguistic"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IP-N5", claim: "The plurality's stopping role depends on its own necessary/non-contingent modal status and is not satisfied merely by positing a brute contingent plurality while rejecting a demand for its ground.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual: []
    dependencies:
      - { from: "IP-N2", to: "IP-N3", relation_class: "answer_level_condition", disposition: "necessary", note: "Plurality alone does not remove selection; IP-N4 is also required." }
      - { from: "IP-N4", to: "IP-N3", relation_class: "necessary_compatibility_condition", disposition: "necessary", note: "Indexical actuality supports no privileged actuality-selection but does not explain plurality existence." }
      - { from: "IP-N2", to: "IP-N5", relation_class: "definitional_unpacking", disposition: "necessary", note: "Makes the plurality's own modal stopping burden explicit." }

  C-NEC-IMPERSONAL-CONCRETE:
    packet_blob_sha: "1765cd42e8b7ffaf775c4ab5a4756044fdacf3d5"
    necessary_claims:
      - { id: "IC-N1", claim: "At least one metaphysically necessary concrete foundation exists.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IC-N2", claim: "That concrete foundation performs the relevant truth-bearing explanatory role with respect to genuinely contingent reality.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IC-N3", claim: "The foundation is non-agentive in the family-defining explanatory role.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IC-N4", claim: "Its necessity is metaphysical rather than merely nomological necessity inside a contingent setup.", types: ["metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IC-N5", claim: "The relevant explanandum remains genuinely contingent; the necessary concrete foundation does not collapse it into metaphysical necessity.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
      - { id: "IC-N6", claim: "The concrete foundation itself completes the relevant ultimate explanatory role rather than functioning only as an intermediate dependent on an abstract/non-concrete ultimate explanans.", types: ["philosophical","metaphysical"], status: "NECESSARY_FOR_CANDIDATE", A6_class: "CANDIDATE_SPECIFIC" }
    supporting_nonnecessary: []
    contextual:
      - { id: "IC-C1", claim: "The family does not require denial of all abstract entities or principles; it requires that the ultimate explanatory work at issue be concrete.", types: ["philosophical","interpretive"] }
    dependencies:
