construction_rules:
  - "Use Protocol 0.1.7 §23A minimum STEELMAN_PACKET schema without omitting fields."
  - "Packet construction is formulation work, not G1 evidence adjudication."
  - "Every outcome-relevant formulation-source exposure is appended to the active pre-G0 exposure ledger."
  - "Formulation sources outside the evidence window may define a candidate but do not thereby become event evidence."
  - "No candidate receives a weaker or more caricatured packet than rivals."
  - "Candidate-native/tradition-native formulation is preferred where a candidate has identifiable proponents."
  - "Synthetic candidates without a single native proponent must be built from the strongest serious mechanism literature without pretending a school exists."
  - "If packet work reveals a serious unrepresented formulation, route through REVISED_CANDIDATE_REQUIRED rather than silently broadening an admitted packet."

packet_order:
  - wave: 1
    purpose: "affirmative / ontological / survival candidates and their most tradition-sensitive boundaries"
    packets:
      - "R-TRANS"
      - "R-PHYS-REFINEMENT"
      - "V"
      - "S1"
      - "S2"
      - "S3"
  - wave: 2
    purpose: "single-process naturalistic / interpretive / deception candidates"
    packets:
      - "H-IND"
      - "H-SOC"
      - "H-SEED-SPREAD"
      - "L"
      - "F"
  - wave: 3
    purpose: "closed heterogeneous candidates"
    packets:
      - "C-HET-IND"
      - "C-HET-SOC"
      - "C-HET-SEED-SPREAD"
  - wave: 4
    purpose: "required node-level serious-rival formulation controls"
    packets:
      - "X-NONHISTORICITY-NODE-RIVAL"
      - "X-REAL-REFERENT-NONIDENTITY-NODE-RIVAL"

packets:
  - id: "R-TRANS"
    path: "TFP_STRESS_2_STEELMAN_R_TRANS_0_1_0.yaml"
    status: "CONSTRUCTION_COMPLETE__PRE_FREEZE"
    special_checks:
      - "generic embodied event only; do not smuggle material-continuity burden from R-PHYS"
      - "keep divine-agent attribution outside Q1"
  - id: "R-PHYS-REFINEMENT"
    path: "TFP_STRESS_2_STEELMAN_R_PHYS_REFINEMENT_0_1_0.yaml"
    status: "CONSTRUCTION_COMPLETE__PRE_FREEZE"
    special_checks:
      - "non-status-bearing refinement only"
      - "failure does not defeat R-TRANS"
  - id: "V"
    path: "TFP_STRESS_2_STEELMAN_V_0_1_0.yaml"
    status: "CONSTRUCTION_COMPLETE__SYNTHETIC__PRE_FREEZE"
    special_checks:
