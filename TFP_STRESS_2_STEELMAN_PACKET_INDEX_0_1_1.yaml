      - "keep theistic/non-theistic causal-agent issue outside Q1"
  - id: "S1"
    path: "TFP_STRESS_2_STEELMAN_S1_0_1_0.yaml"
    status: "CONSTRUCTION_COMPLETE__PRE_FREEZE"
    special_checks:
