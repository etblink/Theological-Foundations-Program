completion_gate:
  all_status_bearing_candidate_packets_frozen: false
  wave_1_freeze_blocked: true
  wave_1_blocker: "S2_REVISED_CANDIDATE_REQUIRED"
  R_PHYS_refinement_packet_frozen: false
  required_node_rival_packets_frozen: false
  reviewer_B_may_re_review_source_plan_and_coverage: false
  reason: "Wave 1 cannot freeze until Reviewer A resolves S2 packet fidelity. Reviewer B re-review still waits until the full packet set freezes against the exact candidate universe."
