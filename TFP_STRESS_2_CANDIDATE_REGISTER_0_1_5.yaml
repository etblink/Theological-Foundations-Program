    reviewer_A_B4: "RETAIN_AS_NODE_OR_RIVAL_ONLY"
    reason: "Body disposition alone is not a founding-proclamation causal model; it remains live on body/tomb propositions."

  - id: "X-MIXED-DECEPTION-SINCERITY-COMPOSITE"
    category: "SUBSTANTIVE_EXCLUSION"
    reviewer_A_B4: "EXCLUDE_SUBSTANTIVE_WITH_CONDITIONS"
    serious_rival_determination: "Reviewer A found no determinate independently formulated serious model requiring both founding-stratum deliberate fabrication and necessary sincere experience. Pure founding deception is F; sincere experience plus later legendary/literary development is covered by H/C-HET/L."
    truth_warrant_condition_11_effect: "This B4 determination is the explicit showing that the specified mixed deception+sincere-experience class is not a standing unresolved serious rival for Protocol TRUTH_WARRANTED condition 11."
    broader_unmatched_fabrication_rule: "Other serious fabrication composites, including founding fabrication plus necessary interpretation without necessary sincere experience, are not silently excluded; they route to REVISED_CANDIDATE_REQUIRED if outcome-material."
    fallback: "REVISED_CANDIDATE_REQUIRED remains available if later evidence makes such a structure necessary."

  - id: "X-SUBSTITUTION-AS-FULL-CANDIDATE"
    category: "NODE_RIVAL_ONLY__PRE_EVIDENCE_RECLASSIFICATION"
    reviewer_A_B4: "S2_RECLASSIFY_NODE_RIVAL_ONLY"
    amendment_ref: "TFP_STRESS_2_S2_PRE_EVIDENCE_AMENDMENT_0_1_0.yaml"
    reason: "The reviewed tradition-native/proponent sources support a serious substitution/misidentification challenge to crucifixion identity but do not supply a traceable closed founding-proclamation causal mechanism. Retaining the frozen S2 access-and-transmission mechanism as native would misrepresent the sources."
    retained_propositions:
      - "P-CRUC"
      - "P-S2-NOT-CRUCIFIED"
      - "P-S2-SUBSTITUTION-OR-MISIDENTIFICATION"
    node_rival_obligations:
      - "steelman-quality formulation from the permitted formulation sources"
      - "direct evidence route and sufficiency record on P-CRUC"
      - "preserve the rival's own argument form: no disciple-eyewitness, misidentification, doubt"
      - "formulation sources remain FORMULATION_ONLY and are not public event evidence by authority"
      - "C4-controlled"
    truth_warrant_condition_11_effect: "The serious substitution/misidentification rival remains explicitly represented and must be adequately tested at node level; it is not silently discarded."
    revised_candidate_fallback: "Any outcome-material no-crucifixion-plus-founding-mechanism pattern not represented by an admitted candidate routes to PROPOSED_REVISED_CANDIDATE_REQUIRED_WITHIN_SCOPE rather than expanding this node rival post hoc."
    c4_controlled: true

  - id: "X-ARBITRARY-SPECULATIVE-MODELS"
    category: "SUBSTANTIVE_EXCLUSION"
    reviewer_A_B4: "EXCLUDE_SUBSTANTIVE"
    reason: "Models lacking serious scholarly/traditional representation or an independently defensible argument fail SERIOUS_RIVAL."

  - id: "X-REAL-REFERENT-NONIDENTITY"
    category: "NODE_RIVAL_ONLY"
    reviewer_A_B4: "RETAIN_AS_NODE_OR_RIVAL_ONLY"
    reason: "A real extramental referent that fails EMB-3 is neither R nor V; preserve it as a rival on P-V-IDENTITY-JESUS and EMB-3 rather than inflate it into a full founding-origin candidate."

