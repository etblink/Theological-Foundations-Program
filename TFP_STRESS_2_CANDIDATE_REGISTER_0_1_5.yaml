shared_definitions:
  P_HIST_JESUS:
    proposition_id: "P-HIST-JESUS"
    text: "A historical first-century Jewish subject identifiable as Jesus of Nazareth existed and is the subject to whom the study's crucifixion/resurrection claims refer."
    classification: "NONCOMPARATIVE_SHARED_FLOOR_AFTER_B4_FREEZE"
    b4_basis: "Reviewer A approved nonhistoricity as node/rival-only and approved SHARED_FLOOR after conditions (a)-(f)."
  P_EARLY_PROCLAMATION_EXISTENCE:
    proposition_id: "P-EARLY-PROCLAMATION-EXISTENCE"
    text: "A historically recoverable founding proclamation concerning postmortem vindication, exaltation, resurrection, or equivalent continued significance of Jesus existed early enough to be investigated."
    classification: "NONCOMPARATIVE_SHARED_FLOOR__B4_APPROVED__PENDING_FINAL_FREEZE"
    all_candidate_requirement: true
  P_CRUC:
    proposition_id: "P-CRUC"
    text: "Jesus himself underwent the outcome-material Roman crucifixion event attributed to him."
    classification: "NOT_SHARED_FLOOR"
  P_DEATH:
    proposition_id: "P-DEATH"
    text: "Jesus entered the outcome-material biological death state as operationally defined in TFP_STRESS_2_Q1_EVENT_CONTROL_0_1_2.yaml."
    classification: "NOT_SHARED_FLOOR"

family_rules:
  organizational_umbrellas_are_not_status_bearing: true
  only_units_listed_under_status_bearing_candidates_receive_A12_status: true
  no_candidate_switching_after_exposure: true
  evidence_binding_rule: "A status-bearing candidate may cite an evidence class as positive support only if its frozen steelman packet registers that class as expected or directly relevant; materially contrary results then weaken that same candidate."
  candidate_failure_does_not_strengthen_rival_by_default: true
  causal_partition_ref: "TFP_STRESS_2_CAUSAL_PROFILE_PARTITION_0_1_1.yaml"

status_bearing_candidates:
  - id: "R-TRANS"
    canonical_name: "R-EMBODIED-GENERIC"
    family: "R"
    name: "Generic embodied post-death event"
    status_bearing: true
    relation_to_R_PHYS: "R-PHYS is a nested non-status-bearing refinement. It never competes with R-TRANS under N3."
    core: "Jesus was crucified, genuinely died, and subsequently existed as the same personal subject in an embodied postmortem state satisfying EMB-1 through EMB-3; at least one pre-Pauline founding encounter stream involving that embodied Jesus was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-R-BODY"
      - "P-R-FOUNDING-ENCOUNTER"
      - "P-R-CAUSAL"
    body_disposition_expectation: "No specific tomb/body-disposition proposition is necessary to R-TRANS unless frozen in its steelman packet. Body-disposition evidence may support or weaken R only through a registered expectation tied to EMB-1/2/3 or another necessary proposition."
    q1_relation: "This is the sole status-bearing affirmative R_EVENT candidate."
    truth_warrant_rule: "TRUTH_WARRANTED may attach directly to R-TRANS if its necessary propositions and all protocol conditions are met; no R-PHYS/R-TRANS sibling dominance is required."

  - id: "V"
    family: "V"
    name: "Veridical non-embodied postmortem encounter"
    status_bearing: true
    core: "Jesus was crucified and died; at least one real extramental postmortem referent identical with Jesus existed in a non-embodied mode and a corresponding founding encounter stream was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-V-REAL-REFERENT"
      - "P-V-IDENTITY-JESUS"
      - "P-V-NONEMBODIED"
      - "P-V-FOUNDING-CAUSAL"
    body_disposition_expectation: "No empty-tomb/body-disposition claim is necessary to V. Body evidence is neutral unless its packet registers a candidate-specific expectation."
    causal_agent_scope: "Q2 is deferred; V does not gain or lose admission based on whether the non-embodied referent is explained theistically or non-theistically."
    q1_relation: "Denies P-R-BODY because it fails EMB-1 or EMB-2."

  - id: "H-IND"
    family: "H"
    name: "Subjective individual-experience origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical individual subjective experiences occurred in the founding stratum and M-IND-EXP was PRIMARY; social and interpretive processes were at most CONTRIBUTING_NONNECESSARY."
    causal_profile_ref: "H-IND"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-HIND-EXPERIENCE-OCCURRED"
      - "P-HIND-NONVERIDICAL"
      - "P-HIND-MECHANISM-SUFFICIENT"
      - "P-HIND-FOUNDING-CAUSAL"
    closed_mechanism_list:
      required: ["M-IND-EXP"]
      permitted_nonnecessary: ["M-SOC-EXP","M-INTERP","M-LATER-NARR","M-BODY"]
      prohibited_foundational: ["M-FOUNDING-FAB"]
    body_disposition_expectation: "No body/tomb proposition is necessary. Any claimed body evidence is evaluated independently and cannot strengthen H-IND unless a packet expectation is frozen."
    q1_relation: "Denies P-R-BODY and P-V-REAL-REFERENT."

  - id: "H-SOC"
    family: "H"
    name: "Subjective social/group-experience origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical subjective experiences occurred in a social/group process and M-SOC-EXP was PRIMARY; an individual seed and interpretation were at most CONTRIBUTING_NONNECESSARY."
    causal_profile_ref: "H-SOC"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-HSOC-GENUINE-SUBJECTIVE-EXPERIENCES"
      - "P-HSOC-SOCIAL-PROCESS-OCCURRED"
      - "P-HSOC-NONVERIDICAL"
      - "P-HSOC-MECHANISM-SUFFICIENT"
      - "P-HSOC-FOUNDING-CAUSAL"
    closed_mechanism_list:
      required: ["M-SOC-EXP"]
      permitted_nonnecessary: ["M-IND-EXP","M-INTERP","M-LATER-NARR","M-BODY"]
      prohibited_foundational: ["M-FOUNDING-FAB"]
    seed_then_spread_boundary: "If M-IND-EXP is PRIMARY or NECESSARY_CONTRIBUTING together with M-SOC-EXP while M-INTERP is nonnecessary, H-SOC fails and H-SEED-SPREAD is the admitted candidate. If M-INTERP is also necessary, use C-HET-SEED-SPREAD."
    body_disposition_expectation: "No body/tomb proposition is necessary; packet expectations govern any body-evidence use."
    q1_relation: "Denies P-R-BODY and P-V-REAL-REFERENT."

  - id: "H-SEED-SPREAD"
    family: "H"
    name: "Subjective individual-seed plus social-amplification origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical individual subjective experience and a distinct social/group amplification process were each PRIMARY or NECESSARY_CONTRIBUTING to the founding proclamation, with at least one PRIMARY; interpretive processing was only CONTRIBUTING_NONNECESSARY or NONE; no founding fabrication was necessary."
    causal_profile_ref: "H-SEED-SPREAD"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-HSEED-INDIVIDUAL-EXPERIENCE"
      - "P-HSEED-SOCIAL-AMPLIFICATION"
      - "P-HSEED-NONVERIDICAL"
      - "P-HSEED-MECHANISM-SUFFICIENT"
      - "P-HSEED-FOUNDING-CAUSAL"
    closed_mechanism_list:
      required: ["M-IND-EXP","M-SOC-EXP"]
      permitted_nonnecessary: ["M-INTERP","M-LATER-NARR","M-BODY"]
      prohibited_foundational: ["M-FOUNDING-FAB"]
    interpretive_boundary: "M-INTERP must be CONTRIBUTING_NONNECESSARY or NONE. If it is PRIMARY or NECESSARY_CONTRIBUTING, route to C-HET-SEED-SPREAD."
    genuine_experience_required: "Both the individual seed and the social-amplification component require genuine non-veridical subjective experiences; report formation without genuine experiences does not satisfy either required experience mechanism."
    body_disposition_expectation: "No body/tomb proposition is necessary; any body-disposition use must be frozen in the steelman packet."
    q1_relation: "Denies P-R-BODY and P-V-REAL-REFERENT."

  - id: "L"
    family: "L"
    name: "Interpretive/scriptural/narrative-development origin"
    status_bearing: true
    core: "Jesus was crucified and died; M-INTERP was PRIMARY in generating the founding proclamation; individual/social subjective experiences were only CONTRIBUTING_NONNECESSARY or NONE; founding deliberate fabrication was NONE."
    causal_profile_ref: "L"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-L-INTERPRETIVE-ORIGIN"
      - "P-L-EXPERIENCE-NONPRIMARY"
      - "P-L-ENCOUNTER-CLAIM-ORIGIN"
      - "P-L-DEVELOPMENT-SEQUENCE"
      - "P-L-FOUNDING-CAUSAL"
    experience_nonprimary_definition: "P-L-EXPERIENCE-NONPRIMARY requires both M-IND-EXP and M-SOC-EXP to be CONTRIBUTING_NONNECESSARY or NONE. NECESSARY_CONTRIBUTING is not permitted under L."
    fabrication_boundary: "M-FOUNDING-FAB must be NONE. Later literary/theological development may be deliberate without becoming F unless it is origin-material knowing falsehood as defined in the causal-profile artifact."
    body_disposition_expectation: "No single tomb/body-disposition fact is necessary unless frozen in the L packet; any body-disposition mechanism must be registered before exposure."
    q1_relation: "Does not require a veridical postmortem referent."

  - id: "S1"
    family: "S"
    name: "Crucified but survived"
    status_bearing: true
    core: "Jesus himself underwent the crucifixion event but did not enter the study's P-DEATH state; subsequent access to the living Jesus was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-S1-NONDEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-S1-POSTCRUC-ACCESS"
      - "P-S1-FOUNDING-CAUSAL"
    origin_mechanism_closed: "Continued biological life plus subsequent access/encounter with the living Jesus; cause of survival is not part of Q1."
    body_disposition_expectation: "A body disposition incompatible with continued living access weakens S1; no empty-tomb claim is automatically favorable."
    q1_relation: "Affirms P-CRUC and denies P-DEATH."

  - id: "S3"
    family: "S"
    name: "Non-crucifixion escape/removal/rescue without substitution"
    status_bearing: true
    core: "Jesus did not undergo the crucifixion event and did not enter P-DEATH; no substitute victim occurred within this candidate; Jesus continued alive after an escape, removal, or rescue process, and subsequent access/knowledge of the living Jesus was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-S3-NOT-CRUCIFIED"
      - "P-S3-NO-SUBSTITUTE"
      - "P-S3-CONTINUED-LIFE"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-S3-POSTEVENT-ACCESS"
      - "P-S3-FOUNDING-CAUSAL"
    origin_mechanism_closed: "Non-crucifixion continued life without a substitute victim plus subsequent access/knowledge. The causal explanation for escape/removal/rescue is left unspecified because specific causal-agent attribution is out of Q1."
    falsifiability: "SUPPORTED_WITHIN_SCOPE P-CRUC or P-DEATH contradicts S3. S3 accepts ordinary death/crucifixion evidence as evidence against itself; it receives no authority exemption."
    body_disposition_expectation: "No Jesus corpse is expected from an event Jesus did not undergo; specific third-party body claims require a packet expectation."
    q1_relation: "Denies P-CRUC and P-DEATH."

  - id: "F"
    family: "F"
    name: "Founding-stratum deliberate deception"
    status_bearing: true
    core: "Jesus was crucified and died; one or more origin-material founding claims were knowingly asserted or constructed as materially false by actors necessary to the founding proclamation; M-FOUNDING-FAB was PRIMARY."
    causal_profile_ref: "F"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-F-DELIBERATE"
      - "P-F-ORIGIN-MATERIAL"
      - "P-F-MOTIVE-OPPORTUNITY-ROUTE"
      - "P-F-TRANSMISSION-SUFFICIENT"
      - "P-F-FOUNDING-CAUSAL"
    fabrication_definition: "Founding fabrication is knowing origin-material false assertion/construction intended or accepted as true by the movement. Mere memory error, interpretation, symbolic literature, or later non-origin literary elaboration is not F."
    body_disposition_expectation: "No body/tomb proposition is automatically favorable; any body-disposition action used by F must be explicitly registered in its packet."
    founding_causal_rule: "P-F-FOUNDING-CAUSAL requires M-FOUNDING-FAB to be PRIMARY under the common causal-role ladder; later-only invention cannot satisfy it."
    q1_relation: "Does not require a veridical postmortem referent."

  - id: "C-HET-IND"
    family: "C-HET"
    name: "Heterogeneous individual-experience + interpretation + later-development model"
    status_bearing: true
    core: "Jesus was crucified and died; M-IND-EXP and M-INTERP were each PRIMARY or NECESSARY_CONTRIBUTING at founding, with at least one PRIMARY; later M-LATER-NARR and the frozen M-BODY component are necessary to this candidate's overall evidence pattern; no veridical referent or founding fabrication occurred."
    causal_profile_ref: "C-HET-IND"
