      - "G1W1-003: Galatians 2:1-10 reports Paul's contact with recognized Jerusalem leaders including James and Cephas."
      - "G1W1-018: Romans 1:3-4 presents Jesus Christ as descended from David according to flesh; traditional status is not assumed."
