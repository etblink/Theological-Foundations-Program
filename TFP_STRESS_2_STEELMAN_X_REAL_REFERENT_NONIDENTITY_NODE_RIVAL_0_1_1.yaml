  - "Identity evidence must independently connect the same postmortem referent to the pre-mortem Jesus."
  - "A real referent that fails EMB-3 does not become R or V."
  - "If a specific serious non-Jesus referent mechanism becomes outcome-material, route to REVISED_CANDIDATE_REQUIRED rather than expanding this node control."

