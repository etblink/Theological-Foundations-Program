native_formulation: "A founding encounter may involve a real extramental referent while the identity attribution 'this referent is Jesus' is false or not warranted. The referent could be another agent, an impersonator, or another real phenomenon whose identity was misattributed. This node rival exists to prevent evidence for extramentality from automatically satisfying personal identity. It is not a full origin candidate because no particular non-Jesus agent/mechanism is admitted here."

