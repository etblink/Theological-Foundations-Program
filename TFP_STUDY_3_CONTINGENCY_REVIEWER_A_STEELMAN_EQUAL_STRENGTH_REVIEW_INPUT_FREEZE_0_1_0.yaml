  - "specificity"
  - "source quality"
  - "objection coverage"
  - "charitable formulation"

review_rules:
  - "Review each packet for B3 completeness and strength relative to the strongest frozen candidate formulation."
  - "Assess whether serious proponent/native sources actually fit the candidate; flag over-attribution or source mismatch."
  - "Synthetic-family status alone is not a weakness if the packet clearly distinguishes TFP synthesis from source-specific claims and uses the strongest appropriate adjacent literature."
  - "Do not reward or penalize a candidate for being theistic, naturalistic, anti-realist, heterodox, historical, or synthetic."
  - "Check that objections are serious and comparably strong rather than straw objections."
  - "Check that common caricatures are rejected and that downstream properties are not silently imported."
  - "Check especially the frozen boundaries: HOLISTIC vs SELF; GLOBAL-DEFLATION vs MODAL-DISSOLUTION; INDETERMINATE vs B6; necessary foundation vs God; AXIARCHIC vs personal perfect goodness."
  - "If bibliographic identity/source fit needs verification, inspect only source landing pages, abstracts, tables of contents, or primary formulations needed for that purpose. Do not conduct outcome-evidence research."
  - "Do not rank candidates, estimate truth probabilities, adjudicate which is best, or begin G1 evidence acquisition."

