  operative_claim_inventory:
    artifact: "TFP_STUDY_3_CONTINGENCY_INITIAL_CLAIM_TYPING_DEPENDENCY_AND_NECESSITY_INVENTORY_0_1_2.yaml"
    blob_sha: "a3146e2b1a359856544301bb6f0fa4af55e48b54"
