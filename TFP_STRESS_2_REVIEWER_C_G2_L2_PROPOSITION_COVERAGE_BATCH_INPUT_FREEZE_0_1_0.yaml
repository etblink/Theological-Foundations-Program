coverage_review_standard:
  - "Audit each proposition against its exact required strata, predesignated substitutes, access rules, and the actual inventory."
  - "The L2 matrix is an index/binding artifact, not evidence that coverage is sufficient."
  - "P-DEATH and P-S1-NONDEATH must receive symmetric treatment."
  - "A Roman crucifixion survival possibility does not establish target-case survival; uncertainty over exact death mechanism does not establish nondeath."
  - "Burial/body-disposition evidence is eligible only on frozen routes, especially S1 and F-BODY-REMOVAL; do not use it to certify generic R/V/H/L/C-HET routes where G0 declares it neutral."
  - "For P-F-MOTIVE-OPPORTUNITY-ROUTE, check both frozen implementations and the actor/opportunity/source burden; no third implementation may be invented."
  - "For C-HET timing propositions, L2 coverage concerns historical stratum/timing/context only; mechanism occurrence remains for L3/L4."
  - "If incomplete, identify the smallest exact acquisition/search defect."

