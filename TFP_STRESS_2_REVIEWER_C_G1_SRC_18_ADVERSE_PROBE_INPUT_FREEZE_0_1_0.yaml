repository_artifacts_not_permitted_as_substantive_reasoning:
  - "Reviewer A reports, prompts, and reasoning"
  - "Reviewer B reports, prompts, and reasoning"
  - "Reviewer C pre-G0 report, prompt, and repair reasoning"
  - "Program-lead chats, issue/PR commentary, or unpinned later evidence artifacts"
  - "Any G2/G3 synthesis or candidate-direction result"

external_access:
  web_and_external_literature: "REQUIRED"
  purpose: "SRC-18 adverse critical probe only"
  source_plan_requirement: "Before COMPLETE or MATERIALLY_COMPLETE coverage, use at least one credible external index/citation trail or critical stream not used to construct the original source plan, specifically searching for omitted adverse evidence/source classes."
  route_independence_requirement:
    - "Name every external index/citation trail/critical stream used."
    - "At least one route must be credibly distinct from the routes/material actually used to construct the source plan, as evidenced by the permitted exposure ledger and source-plan artifacts."
    - "Do not satisfy the probe merely by re-reading the 41 inventoried sources."
    - "Do not treat a new URL for the same already-inventoried argument as a new adverse source class."

assigned_scope:
  source_stratum: "SRC-18"
  current_wave_1_strata_to_challenge: ["SRC-01","SRC-02","SRC-04","SRC-06","SRC-19"]
  search_targets:
    - "omitted serious adverse evidence bearing on frozen necessary propositions served by Wave 1"
    - "omitted source classes or citation trails that could materially change later truth-critical adjudication"
    - "credible contrary evidence or methodological criticism relevant to candidate/background routes"
    - "adverse material for node rivals and shared-floor propositions where the frozen source plan assigns SRC-18"
  symmetry_rule: "Search adverse material against all serious candidate/background routes implicated by Wave 1; do not define 'adverse' as merely anti-resurrection or anti-Christian."
  preservation_rule: "Record inaccessible, missing, contradictory, negative, and null results. Do not resolve historical disputes merely because one side appears stronger."

prohibited_during_probe:
  proposition_dispositions: true
  discriminator_direction_results: true
  candidate_ranking: true
  candidate_verdicts: true
  resurrection_established_or_defeated: true
  theological_conclusion: true
  frozen_G0_architecture_change: true
  coverage_complete_or_materially_complete_certification: true
  repository_changes: true

required_probe_record:
  - "session/provider/model provenance and freshness declaration"
  - "verified repository blob identities"
  - "external route/index/citation-trail identity and why at least one route is independent of original source-plan construction"
  - "search terms, seeds, citation trails, and stopping rationale sufficient for reproducibility"
  - "each credible surfaced source: bibliographic identity, access status, source class, target proposition/route, and observation-only reason it may matter"
  - "each material access failure or inaccessible source"
  - "each credible omitted source class, if any"
  - "explicit null results where a bounded adverse search returns none"
  - "whether any finding requires Program Lead acquisition before a later coverage-state review"

required_disposition_one_of:
  - "SRC_18_PROBE_NULL_WITHIN_BOUNDS"
  - "SRC_18_PROBE_FINDINGS_REQUIRE_ACQUISITION"
  - "SRC_18_PROBE_INCOMPLETE"
  - "INVALID_REVIEW"

next_gate_rule:
  if_null_within_bounds: "Return the report. Program Lead may then freeze a separate Reviewer C coverage-state review. Do not certify coverage in this probe."
  if_findings_require_acquisition: "Return exact source/source-class findings. Program Lead must acquire and ledger them observation-first before coverage-state review."
  if_incomplete: "State the missing route/access needed. No completeness claim is permitted."

authorization:
  g0_authorized: true
  g1_authorized: true
  g2_synthesis_authorized: false
  g3_comparative_adjudication_authorized: false
