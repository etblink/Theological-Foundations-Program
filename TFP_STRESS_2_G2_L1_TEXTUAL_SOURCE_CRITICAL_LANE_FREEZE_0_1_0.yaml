source_quality:
  principles:
    - "Earlier is not automatically better; later is not automatically worse."
    - "Repeated Pauline passages are one author stream, not independent votes."
    - "Synoptic overlap and possible Johannine/Acts literary dependence are carried rather than treated as independent convergence."
    - "Acts speeches are literary/source-critical evidence with disputed access to earlier material, not verbatim founding transcripts by default."
    - "Second-century reception can illuminate transmission/development but cannot independently establish founding events."
    - "Modern psychological/social/mechanism literature supplies mechanism capacity/reference-class controls, not direct first-century occurrence evidence."
    - "Adverse historiography is evaluated claim-specifically; access failures are preserved and never converted into favorable evidence for a rival."
  primary_text_base:
    strength: "STRONG_FOR_TEXTUAL_ATTESTATION__LIMITED_FOR_EVENT_OR_CAUSAL_TRUTH"
    key_streams:
      - "Pauline: 1 Cor 15:1-11; 1 Cor 9:1; Gal 1-2; Rom 1:3-4; Phil 2:6-11; 1 Thess 4:13-18; 1 Cor 15:35-54; 2 Cor 5:1-10"
      - "Canonical narratives: Mark 15-16; Matthew 27-28; Luke 23-24; John 19-21"
      - "Acts proclamation speeches: Acts 2, 3, 10, 13"
      - "Early reception/noncanonical: Ignatius, 1 Clement, Polycarp, Didache, Gospel of Peter"
  source_critical_controls:
    strength: "MATERIAL_BUT_ACCESS_LIMITED"
    limits:
      - "1 Cor 15 formula-boundary controls are mostly abstract-level."
      - "Synoptic, Acts-speech, Johannine, chronology, and Pauline body-semantic controls are substantially abstract/excerpt/reference-entry level."
      - "Collins full chapter, Lüdemann full book, Goulder full chapter, Klawans chapter, and several other full-text controls remain unavailable."
  dependence_clusters:
    - id: "DEP-PAUL"
      rule: "Pauline passages share one author/institutional stream unless a separately warranted embedded tradition is established."
    - id: "DEP-SYNOPTIC"
      rule: "Mark/Matthew/Luke cannot be counted as three fully independent streams without source-critical warrant."
    - id: "DEP-JOHN"
      rule: "John is separately inventoried but its relationship to Synoptic/other traditions remains disputed."
    - id: "DEP-ACTS"
      rule: "Acts speech material remains a later Lukan literary stream with disputed earlier-source content."
    - id: "DEP-RECEPTION"
      rule: "Ignatius/1 Clement/Polycarp/Didache/Gospel of Peter are later reception/development streams, not first-generation event witnesses."

