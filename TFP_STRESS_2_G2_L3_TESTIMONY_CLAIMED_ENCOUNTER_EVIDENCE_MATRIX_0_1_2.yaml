      - "These are not automatically independent founding streams."
    limits:
      - "Synoptic, Johannine, and Acts source relationships remain dependence-limited."
      - "Narrative report is not identical to event occurrence."
  T3_SOURCE_DEPENDENCE:
    source_ids: ["G1W1-008","G1W1-030","G1W1-031","G1W1-032","G1W1-033"]
    observations:
      - "Formula boundaries, Synoptic dependence, Acts speech provenance, Johannine composition, and Pauline chronology are explicit controls."
    limits:
      - "Most controls remain abstract/excerpt/reference-entry level."
  T4_LATER_RECEPTION_DEVELOPMENT:
    source_ids: ["G1RS-053","G1RS-054","G1RS-070","G1RS-062"]
    observations:
      - "Early reception and noncanonical material show persistence and elaboration of resurrection/encounter claims."
    limits:
      - "Later reception does not independently establish first-generation testimony or event truth."
  T5_INDIVIDUAL_EXPERIENCE_CONTROLS:
    source_ids: ["G1RS-059","G1RS-072","G1RS-073","G2L3R-001","G2L3R-002"]
    observations:
      - "Modern bereavement sensory experiences demonstrate a reference class of genuine individual experiences."
      - "Lüdemann and Goulder remain full-text access-limited."
      - "G2L3R-001 supplies the Reviewer-C-authorized argument-level substitute: an individual bereavement hallucination or sense-of-presence experience, paradigmatically Peter or another disciple, is proposed as the initiating stimulus after Jesus's death."
      - "G2L3R-001 separately discusses Paul's later first-person/revelatory experience and does not turn Paul into a pre-Pauline founding stream."
      - "G2L3R-002 is a full peer-reviewed accepted-manuscript adverse control that reconstructs Smith's Peter-to-group strategy, reviews bereavement prevalence/modality data, and argues that the proposed group-transfer analogies do not map well to the target case."
    limits:
      - "Modern bereavement experience is not automatically the ancient target case and does not itself establish nonveridicality."
      - "Smith 2024 is a preprint/open-peer-review argument, not direct target-case observation."
      - "Loke/Meader full accepted manuscript is acquired, but its historical premises and target-case comparisons remain contestable rather than authoritative."
  T6_SOCIAL_EXPERIENCE_CONTROLS:
    source_ids: ["G1RS-060","G1RS-061","G1RS-068","G2L3R-001","G2L3R-002"]
    observations:
      - "Memory conformity, social contagion, collective memory, and failed-expectation movement responses are empirically documented."
      - "G2L3R-001 explicitly rejects literal shared hallucination as the group mechanism and instead proposes collective delusion/social propagation from an individual stimulus."
      - "It identifies the Twelve and 500-plus as group-appearance targets the model attempts to explain and proposes communication from an initial visionary to others as the transfer mechanism."
      - "G2L3R-002 provides full argument-level peer-reviewed adverse testing, including objections to the mass-psychogenic-illness mapping, shared-perception transfer, and cognitive-dissonance analogies."
    limits:
      - "Social influence is not equivalent to a group hallucination."
      - "Reference-class transfer to early Christianity must be independently warranted."
      - "Smith's Zeitoun/crowd analogies are analogical controls, not direct evidence that an early Christian group process occurred."
  T7_REFERENT_AND_TESTIMONY_CONTROLS:
    source_ids: ["G1RS-065","G1RS-066","G1RS-067"]
    observations:
      - "The corpus contains paired pro/critical anomalous-information literature, personal-identity/embodiment philosophy, and testimony/miracle epistemology."
    limits:
      - "These sources do not directly establish an ancient extramental referent."
      - "Philosophical possibility and general testimony theory do not settle case-specific reliability."
  T8_SURVIVAL_ACCESS_CONTROL:
    source_ids: ["G1RS-064","G1W1-012","G1W1-026","G1W1-042","G1W1-043"]
    observations:
      - "Survival/nondeath is explicitly represented and L2 found P-S1-NONDEATH evidence-against within its lane."
    limits:
      - "Encounter reports are not automatically living-Jesus access."
      - "L3 must assess report identity/access without borrowing a discriminator direction."

