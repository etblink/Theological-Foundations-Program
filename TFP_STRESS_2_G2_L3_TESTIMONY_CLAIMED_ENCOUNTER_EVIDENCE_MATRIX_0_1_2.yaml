  - "The matrix binds testimony/encounter evidence to frozen propositions but assigns no proposition disposition."
  - "FS-01 remains one upstream stream cluster for convergence absent independent substream warrant."
  - "Paul's own claim does not by itself establish a pre-Pauline founding stream."
  - "Sincerity, occurrence, independence, extramentality, personal identity, embodiment, and causal role are separate questions."
  - "Multiplicity of later reports does not manufacture founding-stream independence."
  - "Modern psychological/social reference classes demonstrate capacities and possible mechanisms, not target-case operation."
  - "G2L3R-001 supplies an argument-level target-case mechanism for coverage purposes but is not thereby accepted as historically true."
  - "G2L3R-002 preserves a live adverse transfer critique and prevents the substitute from being treated as uncontested."
  - "A testimony source may be sincere yet mistaken; sincerity alone is not external truth."
  - "No failure of a rival is used as positive evidence for another candidate."
  - "L2 P-DEATH support is available as historical context but does not decide any L3 encounter ontology."
  - "No discriminator direction rule is applied in L3 matrix construction."

