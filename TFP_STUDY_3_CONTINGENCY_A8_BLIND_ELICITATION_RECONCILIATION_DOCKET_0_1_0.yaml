reconciliation_principles:
  - "Blind elicitation is independent input, not automatic authority."
  - "Do not admit a blind dimension merely because Reviewer C named it."
  - "Do not retain a Program Lead dimension merely because it appeared in the initial register."
  - "Every inclusion/exclusion must satisfy Protocol A8(1)-(5)."
  - "Every split/merge must satisfy A8.2 by changing or not changing a frozen truth-critical inference."
  - "Candidate answers, outcome labels, and epistemic abstention are not backgrounds."
  - "No theism, naturalism, supernaturalism, skepticism, or confessional authority may be installed silently."
  - "The operative A4/A5/A6 inventory may now be used to judge truth-critical relevance."

blind_dimension_mapping:
  BG-D01:
    blind_label: "Status of the explanandum"
    overlap_with_initial:
      - "BG-TOTALITY-EXPLANANDUM"
    program_lead_provisional_disposition: "PARTIAL_MATCH__EXPANSION_OR_SPLIT_REQUIRED"
    reason:
      - "The determinate-totality versus itemwise-only distinction is not fully represented by the existing two-variant totality dimension."
      - "The semantic-defect/not-truth-apt limb may instead belong to BG-D12 or be candidate-subsumed."
    Reviewer_C_decision_required:
      - "Should the totality dimension gain an explicit no-determinate-totality/itemwise-only variant?"
      - "Should semantic defect be separated from totality and handled under question-legitimacy or candidate boundaries?"

  BG-D02:
    blind_label: "Modality governing contingent and necessary"
    overlap_with_initial:
      - "BG-MODALITY-ACTUALITY"
    program_lead_provisional_disposition: "PARTIAL_MATCH__LIKELY_SPLIT"
    reason:
      - "The initial dimension combines modal truth status with actuality privilege."
      - "The blind pass independently distinguishes metaphysical, logical/conceptual, nomic, epistemic, and deflationary modality."
    Reviewer_C_decision_required:
      - "Whether modal semantics/status and actuality privilege must be separate A8 dimensions."
      - "Which modal variants actually change frozen truth-critical inferences."

  BG-D03:
    blind_label: "Explanatory demand"
    overlap_with_initial:
      - "BG-PSR-SCOPE"
    program_lead_provisional_disposition: "MATCH__POSSIBLE_VARIANT_EXPANSION"
    reason:
      - "Strong, restricted, and no-general-demand variants align with PSR-GLOBAL, PSR-RESTRICTED, and PSR-NONDEFAULT."
      - "The blind local-demand-only variant may be materially distinct from the current restricted variant."
    Reviewer_C_decision_required:
      - "Whether local-demand-only requires its own variant."

  BG-D04:
    blind_label: "Admissible explanation relation"
    overlap_with_initial:
      - "BG-EXPLANATORY-REALISM"
      - "BG-AGENTIVE-MODAL-LINK"
      - "BG-ABSTRACT-PRINCIPLE-FORCE"
    program_lead_provisional_disposition: "PARTIAL_MATCH__LIKELY_NEW_RELATION_TYPE_DIMENSION"
    reason:
      - "The initial explanatory-realism dimension concerns whether explanation is objective/robust/pluralist/deflationary."
      - "Cause, grounding, contrastive explanation, nomic subsumption, and intentional explanation may vary independently of explanatory realism."
    Reviewer_C_decision_required:
      - "Whether a distinct explanation-relation dimension is required."
      - "Whether intentional explanation belongs there or remains partly in the agentive-modal link."

  BG-D05:
    blind_label: "Regress and completion"
    overlap_with_initial:
      - "BG-DEPENDENCE-STRUCTURE"
    program_lead_provisional_disposition: "MATCH__POSSIBLE_VARIANT_EXPANSION"
    reason:
      - "Well-founded, non-well-founded, and reflexive structures are already represented."
      - "The blind pass makes infinite-regress completeness and relation-specific viciousness more explicit."
    Reviewer_C_decision_required:
      - "Whether the existing variants are sufficient or require explicit regress-complete/relation-specific variants."

  BG-D06:
    blind_label: "Beginning versus atemporal contingency"
    overlap_with_initial: []
    program_lead_provisional_disposition: "NEW_DIMENSION_CANDIDATE"
    reason:
      - "The initial register does not separately control the inference from contingency to temporal beginning."
      - "The operative study is about metaphysical contingency, so a temporal-origin dimension may function as a guard against importing kalam-style premises."
    Reviewer_C_decision_required:
      - "Admit as a live background, retire by candidate-neutral scope definition, or treat as a non-background scope guard."

  BG-D07:
    blind_label: "Category constraints on a ground"
    overlap_with_initial:
      - "BG-ABSTRACT-PRINCIPLE-FORCE"
    program_lead_provisional_disposition: "PARTIAL_MATCH__LIKELY_SPLIT"
    reason:
      - "Abstract explanatory force is not identical to the broader question whether the ultimate ground must be concrete, may be abstract, or remains category-open."
    Reviewer_C_decision_required:
      - "Whether to split category eligibility from abstract/principle explanatory force."

  BG-D08:
    blind_label: "Admissibility of non-natural posits"
    overlap_with_initial:
      - "initial exclusion BG-NATURALISM-AS-BACKGROUND"
      - "initial exclusion BG-SUPERNATURALISM-AS-BACKGROUND"
    program_lead_provisional_disposition: "NEW_DIMENSION_CANDIDATE__REFORMULATION_REQUIRED"
    reason:
      - "The blind pass decomposes naturalism/supernaturalism into methodological restriction, metaphysical restriction, open admissibility, and causal-closure treatment."
      - "A global worldview label remains prohibited; a precise ontological-admissibility assumption may satisfy A8."
    Reviewer_C_decision_required:
      - "Whether a narrower ontology-admissibility dimension should be admitted and how to define natural/non-natural without circular candidate loading."

  BG-D09:
    blind_label: "Epistemic standard for metaphysical posits"
    overlap_with_initial: []
    program_lead_provisional_disposition: "BOUNDARY_DISPUTE__A8_BACKGROUND_VS_PROTOCOL_METHOD"
    reason:
      - "The dimension can change truth-warrant without changing metaphysical truth."
      - "Protocol evidence/warrant rules may already constrain some of this space, so an A8 background must not duplicate or override protocol method."
    Reviewer_C_decision_required:
      - "Admit only those epistemic standards not already fixed candidate-neutrally by Protocol 0.1.7, or exclude as methodology."

  BG-D10:
    blind_label: "Normative explanation"
    overlap_with_initial:
      - "BG-AXIOLOGICAL-FORCE"
    program_lead_provisional_disposition: "MATCH__POSSIBLE_VARIANT_EXPANSION"
    reason:
      - "The existing axiological-force dimension already distinguishes ontic explanatory force, normative-only force, and anti-realism."
      - "The blind action-only variant may sharpen the normative-only boundary."
    Reviewer_C_decision_required:
      - "Whether the action-only variant adds a truth-critical distinction beyond AX-VALUE-NORMATIVE-ONLY."

  BG-D11:
    blind_label: "Modal-logic strength"
    overlap_with_initial:
      - "BG-MODALITY-ACTUALITY"
    program_lead_provisional_disposition: "NEW_DIMENSION_CANDIDATE__LIKELY_DISTINCT"
    reason:
      - "S5 versus weaker logics can change inferential validity even when parties agree on metaphysical modality."
      - "The initial modality dimension does not separately encode logic strength."
    Reviewer_C_decision_required:
      - "Whether modal-logic strength must be an independent dimension and which systems are materially distinct for frozen inferences."

  BG-D12:
    blind_label: "Question legitimacy"
    overlap_with_initial:
      - "BG-MODALITY-ACTUALITY:MOD-DEFLATIONARY"
      - "initial exclusion BG-SKEPTICISM-AS-BACKGROUND"
    program_lead_provisional_disposition: "CANDIDATE_BACKGROUND_BOUNDARY_DISPUTE"
    reason:
      - "Framework-relative/quietist/verificationist dissolution may change the admissibility of the whole study."
      - "Study candidates already include global-deflation and modal-dissolution families, so installing the same thesis as a background could double-count a candidate answer."
    Reviewer_C_decision_required:
      - "Identify any non-candidate metasemantic residue that qualifies as a background."
      - "Exclude or merge any variant already subsumed by frozen candidate families."

