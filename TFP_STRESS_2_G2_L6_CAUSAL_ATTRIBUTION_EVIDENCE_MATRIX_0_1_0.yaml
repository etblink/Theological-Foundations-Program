matrix_constraints:
  - "No proposition receives causal success merely because its mechanism is plausible, coherent, or attested somewhere."
  - "PRIMARY/NECESSARY_CONTRIBUTING require positive evidence of causal priority/indispensability under the frozen role ladder."
  - "Temporal precedence or early attestation is not sufficient for causal necessity."
  - "P-R-FOUNDING-ENCOUNTER is an occurrence proposition: FS-01 report/tradition existence must not be conflated with embodied encounter occurrence."
  - "R and V causal propositions cannot borrow identity/ontology support across different streams."
  - "H/C-HET psychological mechanism capacity cannot be converted into target-case causal role without target-case warrant."
  - "L cannot treat later narrative development as founding interpretive causation."
  - "F cannot treat general transmission capacity as evidence that founding fabrication was PRIMARY."
  - "S1 cannot relabel appearance reports as living-Jesus causal access."
  - "No unmatched role vector is forced into an admitted candidate; use REVISED_CANDIDATE_REQUIRED only if a serious unmatched vector is actually evidenced."
  - "No D2/D5/D9/D-S1 direction result is issued in matrix construction."

