coverage_review_standard:
  - "Audit each proposition against its exact expected evidence and weakening evidence in the frozen coverage map."
  - "Use L1-L5 lane freezes as evidence summaries, not as automatic causal conclusions."
  - "PRIMARY and NECESSARY_CONTRIBUTING require positive evidence of principal or indispensable causal role; mere presence, plausibility, coherence, chronology, or mechanism capacity is insufficient."
  - "CONTRIBUTING_NONNECESSARY and NONE do not satisfy a required founding mechanism."
  - "For P-R-FOUNDING-ENCOUNTER, distinguish existence of FS-01 as a transmitted encounter-claim tradition from occurrence of an embodied encounter stream satisfying the same-stream ontology/identity requirements."
  - "R and V causal propositions cannot borrow referent/identity/ontology evidence across separate streams."
  - "For H/C-HET, generic psychological/social capacities and Smith's proposed target-case model do not establish PRIMARY/NECESSARY_CONTRIBUTING roles without target-case causal warrant."
  - "For H-SOC/C-HET-SOC, genuine social/group subjective experience remains a separate requirement; report propagation cannot substitute for it."
  - "For L, early interpretive material is not automatically PRIMARY, and later narrative development cannot become founding causation."
  - "For S1, appearance reports cannot be relabeled living-Jesus access; L2 P-S1-NONDEATH evidence-against remains a carried input, not a causal conclusion by itself."
  - "For F, generic deception or transmission capacity is insufficient; M-FOUNDING-FAB requires origin-material knowing deception and PRIMARY role."
  - "For C-HET, every required founding module must be covered in its exact frozen role vector and joint pattern."
  - "Any serious unmatched causal vector must route to REVISED_CANDIDATE_REQUIRED rather than being silently absorbed."
  - "If any scope remains incomplete, identify the smallest exact missing causal-source or analysis defect."

targeted_external_checks:
  allowed: true
  rule: "Use only bounded checks needed to verify a specific causal-coverage claim; do not conduct an open-ended new literature harvest."

prohibited_actions:
