background_argument_formulations:
  BGD_1A:
    formulation: "Physical causal closure treats every caused physical event as having a sufficient physical cause; exclusion-style arguments use that premise to resist irreducible nonphysical causal intervention."
    source_basis: ["G2L5R-001"]
  BGD_1C:
    formulation: "Interventionist theism permits special divine action that is not reducible to ordinary natural causal sufficiency; event attribution still requires independent agency evidence."
    source_basis: ["G2L5R-002","G2L5R-003"]
  BGD_1D:
    formulation: "Noninterventionist theism permits theism while declining to assume event-level suspension or violation of natural causal structure; special-action accounts must explain how divine and created causation relate."
    source_basis: ["G2L5R-003"]
  BGD_1E:
    formulation: "Non-theistic dualist/survival views allow a nonbodily subject or distinctive personal psychology to persist after bodily death and, in some models, causally interact or communicate; identity and interaction remain separate evidential burdens."
    source_basis: ["G2L5R-004","G2L5R-005"]
  BGD_2A:
    formulation: "A strongly restrictive anomaly prior assigns low prior probability to rare event classes based on background regularity/reference-class considerations; testimony must overcome that prior through sufficiently large likelihood ratios."
    source_basis: ["G2L5R-002","G2L5R-011"]
  BGD_2B:
    formulation: "An agnostic-open prior refuses a blanket anomaly penalty beyond independently justified reference-class information and lets explicit uncertainty plus likelihood ratios carry the update."
    source_basis: ["G2L5R-002","G2L5R-011"]
  BGD_2C:
    formulation: "If generic theism is independently live, the conditional likelihood of some divine interventions may exceed that under no-theism; the effect is generic and cannot import Jesus-specific evidence."
    source_basis: ["G2L5R-002","G2L5R-012"]
  BGD_9A:
    formulation: "Reductionism grounds testimonial warrant in non-testimonial sources such as perception, memory, induction, and case/local reliability monitoring."
    source_basis: ["G2L5R-009","G2L5R-010"]
  BGD_9B:
    formulation: "Anti-reductionism permits defeasible testimonial warrant not wholly reduced to independent inductive reliability evidence, while remaining open to defeaters and monitoring."
    source_basis: ["G2L5R-009","G2L5R-010"]

