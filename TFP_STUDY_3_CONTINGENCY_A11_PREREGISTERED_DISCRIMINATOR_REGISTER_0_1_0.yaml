direction_rule_template:
  id: "A11-DR-1-SYMMETRIC-PROPOSITION-DISPOSITION"
  prerequisite: "Comparison-scoped coverage is COMPLETE or MATERIALLY_COMPLETE for both sides under the operative A9 plan, relevant A8 backgrounds/joints have been run or bounded, and provenance is adequate."
  FAVORS_A:
    rule: "A-side state is SUPPORTED_WITHIN_SCOPE while the mutually discriminating B-side state is EVIDENCE_AGAINST or CONTRADICTED_WITHIN_SCOPE; alternatively a candidate-neutral valid argument/constraint establishes A-side and excludes B-side at the exact registered strength."
  FAVORS_B:
    rule: "B-side state is SUPPORTED_WITHIN_SCOPE while the mutually discriminating A-side state is EVIDENCE_AGAINST or CONTRADICTED_WITHIN_SCOPE; alternatively a candidate-neutral valid argument/constraint establishes B-side and excludes A-side at the exact registered strength."
  NEUTRAL_OR_NONDISCRIMINATING:
    rule: "Coverage prerequisite is satisfied, but the comparison either leaves both exact states compatible, supports neither favoring condition, or establishes that the registered axis does not discriminate the named relation."
  UNMAKEABLE:
    rule: "Only after a documented COMPARISON_EFFORT_RECORD shows required evidence/argument access is unavailable, provenance fails, or the frozen search is complete without enough signal to apply the rule. Unperformed or incomplete search is COVERAGE_INCOMPLETE, not UNMAKEABLE."
  symmetry_rule: "Swap A and B and the favoring condition swaps without changing evidential thresholds."

default_comparison_coverage:
  required:
    - "candidate-native or proposition-native access for every named candidate side"
    - "serious adverse/critical access for every named candidate side"
    - "neutral/cross-tradition scholarship where available"
    - "all proposition IDs served are explicitly tagged in the evidence record"
    - "relevant A8 background variants and required compatible joint combinations are applied at the exact inferential point"
    - "source volume, confessional affiliation, author prestige, or tradition size cannot decide the direction"
  MAKEABLE_not_determined_at_G0: true

discriminators:

  D11-01-MODAL-TRUTH-APTNESS:
    title: "Robust modal truth-aptness versus modal dissolution"
    lane: "A10-L4-TRUTH-APTNESS-INDETERMINACY-AND-SEMANTIC-BOUNDARIES"
    relation:
      A_candidate: "C-MODAL-DISSOLUTION"
      B_rival_relation: "ROBUST_TRUTH_APT_MODAL_ULTIMACY"
      B_candidate_members:
        - "C-BRUTE"
        - "C-REGRESS"
        - "C-HOLISTIC"
        - "C-SELF-EXPLANATORY"
        - "C-GLOBAL-DEFLATION"
        - "C-INDETERMINATE-ULTIMACY"
        - "C-NECESSITARIAN"
        - "C-INDEXICAL-PLURALITY"
        - "C-NEC-IMPERSONAL-CONCRETE"
        - "C-NEC-AGENTIVE"
        - "C-NEC-IMPERSONAL-PRINCIPLE"
        - "C-AXIARCHIC"
    served_necessary_propositions: ["MD-N1","MD-N2","MD-N3","MD-N4","IU-N1"]
    A_state: "The central metaphysical-contingency presupposition is non-truth-apt or inapplicable under the correct modal framework, substantively rather than by ignorance."
    B_state: "The relevant ultimacy/modal claims are robustly truth-apt enough for candidate-level metaphysical adjudication."
    prediction_argument: "If the central modal predicate is not truth-apt/applicable, lower-order candidate comparisons cannot simply assume it; if it is truth-apt, C-MODAL-DISSOLUTION loses its defining route."
    proposed_priority: "CRITICAL"
    feasibility_status: "FEASIBLE_WITHIN_SCOPE"
    relevant_backgrounds: ["BG-MODAL-STATUS","BG-D12-QUESTION-DISSOLUTION","BG-D09-EPISTEMIC-STANDARD"]
    coverage_additions: ["modal anti-realist/fictionalist native sources","robust de re modal realist adverse sources","semantic versus epistemic dissolution controls"]
    direction_rule: "A11-DR-1-SYMMETRIC-PROPOSITION-DISPOSITION"

  D11-02-ONTIC-ULTIMACY-INDETERMINACY:
    title: "Ontic ultimacy indeterminacy versus determinate ultimacy"
    lane: "A10-L4-TRUTH-APTNESS-INDETERMINACY-AND-SEMANTIC-BOUNDARIES"
    relation:
      A_candidate: "C-INDETERMINATE-ULTIMACY"
      B_rival_relation: "DETERMINATE_TRUTH_APT_ULTIMACY"
      B_excludes: ["C-MODAL-DISSOLUTION","C-INDETERMINATE-ULTIMACY"]
    served_necessary_propositions: ["IU-N1","IU-N2","IU-N3","IU-N4"]
    A_state: "There is no unique determinate fact of the matter among the relevant ultimacy alternatives, and this indeterminacy is worldly/ontic."
    B_state: "The ultimacy question is truth-apt and has a determinate metaphysical answer even if investigators do not yet know it."
    prediction_argument: "Evidence or argument for ontic metaphysical indeterminacy favors A; evidence that apparent indeterminacy is semantic, epistemic, or eliminated by a determinate metaphysics favors B."
    proposed_priority: "CRITICAL"
    feasibility_status: "FEASIBLE_WITHIN_SCOPE"
    relevant_backgrounds: ["BG-METAPHYSICAL-INDETERMINACY","BG-MODAL-STATUS","BG-D09-EPISTEMIC-STANDARD"]
    coverage_additions: ["ontic-indeterminacy native literature","determinacy-first adverse literature","required INT-MODALSTATUS-INDETERMINACY joint"]
    direction_rule: "A11-DR-1-SYMMETRIC-PROPOSITION-DISPOSITION"

  D11-03-TOTAL-NECESSITY:
