    B_state: "At the relevant totality scope there remains a genuine metaphysically contingent alternative/remainder not reducible to merely internal or indexical variation."
    prediction_argument: "A successful necessitarian modal account must preserve apparent local contingency while excluding a genuinely contingent total alternative; a live total alternative or contingent remainder defeats the defining necessitarian claim."
