A1_working_question:
  text: "Does the existence of contingent reality warrant positing a necessary explanatory ground or foundation rather than accepting contingent reality as brute, and if so, what properties of that foundation are independently warranted without presupposing theism?"
  status: "WORKING_G0_QUESTION__MAY_BE_REFINED_PRE_EVIDENCE_BY_VERSIONED_G0_REPAIR"

A2_generic_scope:
  domain:
    - "metaphysics"
    - "philosophy of explanation and grounding"
    - "philosophy of religion only insofar as candidate families or downstream properties bear on the question"
    - "fundamental physics/cosmology only where claims are used to bear on contingency, necessity, explanation, or fundamentality"
  tradition_boundary: "No confessional, naturalistic, theistic, or anti-theistic authority is installed. Candidate families may be traditional, skeptical, naturalistic, theistic, impersonal, hybrid, or independently generated."
  time_period: "No historical event window. Philosophical sources may span historical and contemporary literature; historical priority or antiquity has no evidential privilege."
  language: "English-accessible scholarship and translations by default; original-language consultation may be required later where a truth-critical historical text interpretation cannot be resolved otherwise."
  geography: "Not geographically bounded except insofar as source traditions/languages require identification."
  source_corpus_generic:
    - "candidate-native philosophical arguments"
    - "serious rival/critical arguments"
    - "modal metaphysics and grounding/explanation literature"
    - "relevant philosophy of physics/cosmology"
    - "neutral/cross-framework scholarship where available"
  explicit_exclusions:
    - "the Kalam temporal-beginning argument as an independent route"
    - "fine-tuning as an independent route"
    - "moral arguments for God"
    - "arguments from consciousness as independent routes"
    - "religious experience as an independent route"
    - "miracle or resurrection evidence"
    - "divine hiddenness"
    - "problem of evil/suffering"
    - "scriptural or revelatory authority"
    - "Jesus/Christology"
    - "denominational doctrine"
    - "any inference from necessary foundation directly to classical theism without separately warranted property steps"
  downstream_inference_limits:
    - "Support for some necessary foundation does not by itself warrant agency, mentality, personhood, goodness, omniscience, omnipotence, providence, worship-worthiness, or identity with the God of any religion."
    - "Failure to warrant a necessary foundation does not by itself establish naturalism."
    - "A successful critique of one explanatory principle does not establish a rival candidate by elimination alone."
    - "Study results may inform later broad-theism synthesis only through separately authorized synthesis."

operational_definition_seeds:
  CONTINGENT:
    provisional: "Could have failed to exist or been otherwise under at least one serious admissible account of metaphysical possibility."
    caution: "The study may not assume one controversial modal semantics as a hidden premise; modality itself is a live background/control surface."
  NECESSARY:
    provisional: "Not metaphysically possible to fail to exist or obtain under the relevant admitted modal framework."
    caution: "Logical, metaphysical, nomological, conceptual, and explanatory necessity must not be conflated."
  EXPLANATION:
    provisional: "A truth-relevant relation that answers why a fact/entity/state obtains, potentially causal, grounding, constitutive, nomological, reason-based, or another explicitly specified relation."
    caution: "No single explanatory relation is privileged before candidate/background review."
  GROUND_OR_FOUNDATION:
    provisional: "An entity, fact, structure, principle, relation, or totality proposed to account for the obtaining/existence of relevant dependent reality."
    caution: "Foundation does not imply temporal priority, efficient causation, mind, or personhood."
  BRUTE:
    provisional: "A fact/entity/state whose obtaining/existence has no deeper truth-relevant explanation required or available under the candidate's strongest formulation."
    caution: "Brute does not mean merely unexplained by us."
  ULTIMATE:
    provisional: "No further truth-relevant explanatory dependence is required beyond the proposed stopping structure under the candidate's strongest formulation."
    caution: "An ultimate explanation may be terminal, holistic, non-well-founded, or otherwise structured; terminality is not assumed."
  PERSONAL_OR_AGENTIVE:
    provisional: "Possessing intentional agency or mind-like purposive capacities sufficient to distinguish an agentive foundation from an impersonal one."
    caution: "This is a downstream property question, not part of the definition of NECESSARY."

