native_formulation: "Jesus genuinely died. After death, a real extramental postmortem referent identical with Jesus existed and was encountered in a non-embodied mode. At least one such founding encounter stream was PRIMARY or NECESSARY_CONTRIBUTING to the founding proclamation. The candidate affirms real postmortem survival/presence while denying that the referent satisfies the study's EMB-1/EMB-2 embodied criteria."

proponent_sources:
  - id: "FORM-V-001"
    title: "Marcus Borg, The Resurrection of Jesus: Physical/Bodily or Spiritual/Mystical?"
    use: "FORMULATION_ONLY"
    contribution: "Serious Christian formulation affirming that Jesus lives/is known as a real spiritual/divine reality while rejecting ordinary physical/bodily resurrection."
  - id: "FORM-R-002"
    title: "William Lane Craig, The Bodily Resurrection of Jesus"
    use: "FORMULATION_ONLY_SECONDARY_DESCRIPTION"
    contribution: "Documents a serious scholarly lineage of nonphysical/spiritual-body and heavenly-vision formulations, while criticizing them."

necessary_propositions:
  - "P-HIST-JESUS"
  - "P-CRUC"
  - "P-DEATH"
  - "P-EARLY-PROCLAMATION-EXISTENCE"
  - "P-V-REAL-REFERENT"
  - "P-V-IDENTITY-JESUS"
  - "P-V-NONEMBODIED"
  - "P-V-FOUNDING-ENCOUNTER"
  - "P-V-FOUNDING-CAUSAL"

authority_commitments:
  - "No theological claim of exaltation, presence, or lordship counts as public historical support merely because a tradition confesses it."
  - "Q2 causal-agent attribution remains outside this candidate."

internal_success_conditions:
  - "The referent is extramental rather than wholly subjective."
  - "The referent is the same personal subject as Jesus."
  - "The referent fails EMB-1 or EMB-2 and therefore is nonembodied under the frozen definition."
  - "A corresponding founding stream is PRIMARY or NECESSARY_CONTRIBUTING."

occurrence_route:
  proposition_id: "P-V-FOUNDING-ENCOUNTER"
  route: "NONCOMPARATIVE_CANDIDATE_SPECIFIC"
  rule: "A qualifying pre-Pauline founding encounter stream must be established on the same frozen stream inventory used for R before ontology, identity, or causal-role comparisons. PARTIALLY_SUPPORTED occurrence ranking-blocks V."
  no_double_counting: "Occurrence does not establish extramentality, identity, nonembodiment, or founding causal role."

body_evidence_binding:
  rule: "BODY_TOMB_NEUTRAL_FOR_Q1_ONTOLOGY"
  positive_use: "PROHIBITED for V"
  negative_use: "PROHIBITED for V"
  trigger_only_routes: ["R-PHYS","S1","F-BODY-REMOVAL","REVISED_CANDIDATE_REQUIRED"]
  anti_switching: "No body/tomb outcome may be converted into V support or adverse evidence after exposure."

expected_evidence:
  - "Encounter/testimony material whose best warranted interpretation points to a real referent but not embodied spatiotemporal causal presence."
  - "Identity evidence linking the referent with Jesus."
  - "Founding-stream causation evidence."
  - "Metaphysical argument showing coherent postmortem personal identity without embodiment."

recognized_objections:
  - "The reviewed proponent literature may be spiritually realist without committing to an extramental personal referent in exactly the study's technical sense."
  - "A referent satisfying EMB-1 and EMB-2 would defeat P-V-NONEMBODIED and route toward R-TRANS only if independent Jesus-identity and other R burdens are also met."
  - "A purely subjective experience would collapse into H-family candidates."
  - "Personal-identity criteria are background-sensitive."

caricatures_rejected:
  - "V is not merely 'hallucination'."
  - "V is not a euphemism for R-TRANS with weaker body language."
  - "V does not require denial of every later bodily narrative; it requires that the founding-causal referent itself be nonembodied."
  - "V does not decide whether the cause of survival/presence is divine."

native_or_proponent_review:
  status: "SYNTHETIC_SERIOUS_FORMULATION"
  reviewer_or_basis: "Program-lead review of FORM-V-001 plus secondary scholarly description in FORM-R-002"
  findings:
    - "A serious nonphysical/spiritual-real resurrection family is represented."
    - "No single reviewed proponent source exactly states all frozen TFP conjuncts, especially the technical extramental-identity-and-founding-causal conjunction."
