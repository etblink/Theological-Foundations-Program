    - "candidate-specific burdens preserved"
    - "no rival-only burden imposed asymmetrically"
    - "formulation sources distinguished from event evidence"
  findings:
    - "The packet gives V a genuinely realist rather than dismissive 'mere vision' formulation."
    - "Synthetic status must be carried into Reviewer B/C review."

packet_stage_notes:
