G1_MODAL_DISSOLUTION_NATIVE:
  prior_gap: "No accessed contemporary primary native source for the non-descriptivist/modal-normativist stratum and no contemporary reply pair."
  current_state: "MATERIALLY_REPRESENTED_FOR_REVIEWER_E_DELTA_RECONCILIATION"
  proposition_surfaces: ["MD-N1","MD-N2","MD-N3","MD-N4"]
  comparison_surface: "D11-01-MODAL-TRUTH-APTNESS"
  sources:
    - id: "G1-S1"
      citation: "Amie L. Thomasson, Norms and Necessity (Oxford University Press, 2020)."
      DOI: "10.1093/oso/9780190098193.001.0001"
      stable_url: "https://academic.oup.com/book/33564"
      access: "PUBLISHER_BOOK_ABSTRACT_AND_CHAPTER_ABSTRACTS"
      argument_level:
        - "Rejects the descriptivist assumption that metaphysical modal claims primarily describe special modal features or possible worlds."
        - "Develops modal normativism: modal discourse functions to convey, reason with, and renegotiate semantic rules and their consequences."
        - "Chapter 2 explicitly presents metaphysical modal terminology as non-descriptive in function and normative in its role."
      boundary: "Do not equate Thomasson's non-descriptivism automatically with MD-N2's stronger claim that the Study-3 contingency presupposition is non-truth-apt or inapplicable. Exact support requires later proposition-level bridge."
    - id: "G1-S2"
      citation: "Boris Kment, 'Necessity and linguistic rules,' Inquiry 67(8):2400-2416 (2024; published online 2023)."
      DOI: "10.1080/0020174X.2023.2231030"
      stable_url: "https://www.tandfonline.com/doi/full/10.1080/0020174X.2023.2231030"
      access: "PUBLISHER_ABSTRACT"
      source_role: "Contemporary adverse reply to Thomasson."
      argument_level:
        - "Questions whether the semantic rules required by modal normativism exist in the needed form."
        - "Defends descriptivist essentialism as explanatorily and epistemically viable."
    - id: "G1-S3"
      citation: "Tom Donaldson and Jennifer Wang, 'Modal Normativism and De Re Modality,' Argumenta 7(2):293-307 (2022)."
      DOI: "10.14275/2465-2334/202214.don"
      stable_url: "https://www.argumenta.org/article/modal-normativism-and-de-re-modality-special-issue/"
      access: "JOURNAL_ABSTRACT_AND_AUTHOR_ARCHIVED_ROUTE"
      source_role: "Contemporary critical reply focused on de re modality."
      argument_level:
        - "Recasts Quinean pressure on linguistic theories of necessity in the context of Thomasson's modal normativism."
        - "Criticizes Thomasson's treatment of de re modality while offering an alternative account compatible with normativism."
  evaluation:
    - "G1 is now represented by a contemporary native formulation plus multiple distinct critical replies."
    - "The evidence is genuinely two-sided; no proposition disposition follows from source admission."
    - "Thomasson's view is non-descriptivist but is not recorded here as wholesale modal noncognitivism or automatic truth-inaptness."
  remaining_gap: "Whether modal normativism actually satisfies MD-N2's disjunctive non-truth-apt-or-inapplicable condition is a proposition-level question, not a source-class acquisition gap."

G2_BRUTE_SKEPTICAL_DEFEAT:
  prior_gap: "The Koons-Pruss empirical-skepticism defense of a restricted PSR and Pruss's earlier inductive-skepticism route were absent."
  current_state: "MATERIALLY_REPRESENTED_FOR_REVIEWER_E_DELTA_RECONCILIATION"
  proposition_surfaces: ["BR-N2","BR-N3","BR-N4"]
  comparison_surface: "D11-05"
  sources:
    - id: "G2-S1"
      citation: "Robert C. Koons and Alexander R. Pruss, 'Skepticism and the principle of sufficient reason,' Philosophical Studies 178:1079-1099 (2021; online 2020)."
      DOI: "10.1007/s11098-020-01482-3"
      stable_url: "https://link.springer.com/article/10.1007/s11098-020-01482-3"
      access: "OPEN_FULL_TEXT"
      argument_level:
        - "Formulates a PSR restricted to basic natural facts."
        - "Argues dialectically that denying a priori knowledge of that restricted PSR leads to radical empirical skepticism across six contemporary theories of empirical knowledge."
        - "The argument is distinct from generic metaphysical rationalism because its leverage is epistemic defeat rather than simply explanatory preference."
    - id: "G2-S2"
      citation: "Alexander R. Pruss, 'Inductive Skepticism,' chapter 18 of The Principle of Sufficient Reason: A Reassessment (Cambridge University Press, 2006), pp. 295-298."
      DOI: "10.1017/CBO9780511498992.018"
      stable_url: "https://www.cambridge.org/core/books/abs/principle-of-sufficient-reason/inductive-skepticism/797FEA5346F965CEA1C560F9AB30AD32"
      access: "PUBLISHER_CHAPTER_SUMMARY"
      argument_level:
        - "Under an Aristotelian conception of laws, argues that an externalist answer to inductive skepticism fails unless the PSR is metaphysically necessary."
  evaluation:
    - "G2 now contains the distinct skeptical-defeat route Reviewer E identified."
    - "The route targets rejection of a restricted PSR and therefore cannot simply be generalized to every formulation of brute ultimacy."
    - "Later proposition adjudication must state the bridge from the restricted-PSR epistemic argument to BR-N2-BR-N4 and D11-05."
  remaining_gap: null

G3_GLOBAL_DEFLATION_CONTEMPORARY_NATIVE:
  prior_gap: "Modern global-deflation/pseudo-question formulations distinct from Hume-Edwards were absent."
  current_state: "MATERIALLY_REPRESENTED_FOR_REVIEWER_E_DELTA_RECONCILIATION"
  proposition_surfaces: ["GD-N2","GD-N3"]
  comparison_surface: "D11-04-GLOBAL-EXPLANATORY-DEMAND"
  sources:
    - id: "G3-S1"
      citation: "Stephen Maitzen, 'Stop Asking Why There's Anything,' Erkenntnis 77(1):51-63 (2012)."
      DOI: "10.1007/s10670-011-9312-0"
      stable_url: "https://philosophy.acadiau.ca/files/sites/philosophy/resources/documents/Maitzen_SAWTA.pdf"
      access: "AUTHOR_HOSTED_FULL_TEXT"
      argument_level:
        - "Argues that the fully general question 'Why is there anything?' is ill-posed rather than merely unanswered by science."
        - "Uses the dummy-sortal problem to argue that unrestricted 'thing' questions lack determinate counting/application criteria."
        - "Maintains that well-posed sortal-specific versions can in principle receive naturalistic answers."
      distinction_from_Hume_Edwards: "This is a question-formation/sortal diagnosis, not merely the claim that explaining each member explains the whole."
    - id: "G3-S2"
      citation: "Stephen Maitzen, 'Questioning the Question,' in Tyron Goldschmidt (ed.), The Puzzle of Existence: Why Is There Something Rather Than Nothing? (Routledge, 2013), pp. 252-271."
      stable_url: "https://philarchive.org/rec/MAIQTQ"
      access: "ARCHIVE_ABSTRACT_AND_AUTHOR/PUBLISHER_METADATA"
      argument_level:
        - "Continues the deflationary diagnosis: the question, when posed as beyond natural science in principle, rests on confusions or false presuppositions."
        - "Defends an intentionally simple naturalistic answer to the unrestricted formulation and diagnoses why stronger readings are ill-posed."
    - id: "G3-S3"
      citation: "Adolf Grünbaum, 'The Poverty of Theistic Cosmology,' British Journal for the Philosophy of Science 55(4):561-614 (2004)."
      DOI: "10.1093/bjps/55.4.561"
      stable_url: "https://www.journals.uchicago.edu/doi/10.1093/bjps/55.4.561"
      access: "PUBLISHER_ABSTRACT_AND_DETAILED_CONTENTS"
      argument_level:
        - "Challenges the Primordial Existential Question by separating the logical possibility of a null world from the further claim that nothingness is the natural/default state requiring an external explanation."
        - "Argues that the 'spontaneity of nothingness' presupposition lacks adequate a priori or empirical support."
      scope_boundary: "The paper also attacks specifically theistic cosmological explanations. Only the global-demand/null-default portions are admitted here for C-GLOBAL-DEFLATION; theism-specific conclusions are not imported into Study 3."
  evaluation:
    - "G3 now includes two Maitzen formulations and Grünbaum's distinct null-default critique."
    - "The class is materially stronger than Hume-Edwards alone and directly addresses whether the unrestricted global explanatory question is well-posed or demands an answer."
    - "No claim is made here that these arguments succeed; they are admitted as native serious routes for later D11-04 adjudication."
  remaining_gap: null

