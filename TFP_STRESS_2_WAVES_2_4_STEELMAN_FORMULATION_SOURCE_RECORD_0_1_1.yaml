  - id: "FORM-H-PROP-001"
    citation: "Stephen H. Smith, 'He appeared to Peter': reconsidering the hallucination hypothesis, Neotestamentica 53(1) (2019): 53-78."
    url: "https://journals.co.za/doi/10.10520/EJC-171fb9fe14"
