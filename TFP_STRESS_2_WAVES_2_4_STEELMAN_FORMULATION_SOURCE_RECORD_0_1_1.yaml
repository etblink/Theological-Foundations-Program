    anti_overreach: "Used only to steelman the P-HIST-JESUS node rival; it is not treated as a full Q1 candidate and Carrier's evidential conclusions are not adopted pre-G0."

  - id: "FORM-XIDENT-001"
    citation: "TFP frozen EMB-3 / P-V-IDENTITY-JESUS architecture plus general identity-attribution controls already in the preregistration."
    url: null
    use: "INTERNAL_SYNTHETIC_NODE_CONTROL"
