  - id: "FORM-L-PROP-001"
    citation: "David Friedrich Strauss, The Life of Jesus, Critically Examined, Death and Resurrection of Jesus; George Eliot translation."
    url: "https://www.cambridge.org/core/books/abs/life-of-jesus-critically-examined/death-and-resurrection-of-jesus/1D7A96D1704DDEA61F2811B5FABDA84B"
