escape_hypothesis_reclassification_note:
  source_id: "FORM-S3-001"
  source: "Andrew Loke, Investigating the Resurrection of Jesus Christ"
  status: "ALREADY_LEDGERED_SOURCE__DEEPER_FORMULATION_READ"
  observed_formulation: "The source explicitly describes an escape hypothesis in which Jesus secretly escapes prior to crucifixion, another person is crucified in his place, and Jesus later shows himself to the disciples and convinces them that he was resurrected."
  immediate_implication: "This formulation is not cleanly S3 because it includes a substitute victim. It is also not the now-reclassified tradition-native substitution node rival because it supplies a full founding mechanism and appears to include intentional deception by Jesus."
  candidate_control: "Do not silently assign this model to S2, S3, or F. Reviewer A must determine whether it constitutes a serious revised status-bearing candidate, is subsumed by an admitted profile, or should remain only a literature-recognized but non-admitted model."
  source_role: "FORMULATION_ONLY. Loke is a critic of the escape hypothesis, not a proponent; B3's no-opponent-only rule therefore remains outcome-material."
