    candidate: "V"
    status: "SYNTHETIC_FORMULATION"
    finding: "A serious nonphysical/spiritual-real resurrection formulation exists, but the exact TFP V conjunction (extramental referent identical with Jesus, nonembodied, founding-causal) is more specific than any one reviewed proponent source. Packet must disclose that it is a synthetic comparison candidate."
