review_standard:
  - "Audit each proposition against its exact required strata, substitutes, access state, node-rival route, dependence rules, and probative-absence semantics."
  - "The shared-floor evidence matrix is an index/binding artifact, not proof that coverage is sufficient."
  - "No consensus shortcut is allowed."
  - "Religious/traditional authority sources used to formulate node rivals are not historical evidence by authority."
  - "Later sources are neither automatically excluded nor automatically independent."
  - "For P-HIST-JESUS, preserve the strongest serious nonhistoricity node rival and distinguish historical-subject evidence from later narrative elaboration."
  - "For P-EARLY-PROCLAMATION-EXISTENCE, test existence of a recoverable founding proclamation only; do not require exact formula boundaries, geography, ontology, or event truth if those are separate propositions."
  - "For P-CRUC, test attribution of the crucifixion event to Jesus against the frozen noncrucifixion/substitution/misidentification family; do not give the node rival founding-causal credit."
  - "Synoptic dependence, Tacitus-source uncertainty, Josephus transmission issues, and 1 Corinthians 15 formula-boundary uncertainty must be carried rather than erased."
  - "Absence cannot exceed the prospectively frozen absence ceilings."
  - "Coverage success/failure has no relative-ranking effect because these are shared-floor propositions."
  - "If any scope is incomplete, identify the smallest exact missing source/access/analysis defect."

targeted_external_checks:
  allowed: true
  rule: "Use only bounded checks needed to verify a specific shared-floor provenance/coverage claim. Do not conduct an open-ended literature harvest."

prohibited_actions:
  - "Do not assign proposition truth dispositions."
  - "Do not create relative candidate credit from a shared-floor result."
  - "Do not apply D0 as a candidate-selecting discriminator."
  - "Do not certify any COMPARISON:<id> MAKEABLE state."
  - "Do not rank candidates."
  - "Do not produce G3 outcomes."
  - "Do not decide whether the resurrection occurred."
  - "Do not draw theological conclusions."
  - "Do not modify the repository."

