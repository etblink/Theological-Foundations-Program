route_principle:
  comparative_route: "Use COMPARATIVE_ROUTE only when a frozen pairwise discriminator directly determines the truth-status of the necessary proposition for at least one candidate. Every such entry names at least one proposed-CRITICAL discriminator."
  noncomparative_candidate_specific: "Use NONCOMPARATIVE_CANDIDATE_SPECIFIC when pairwise comparison would distort a candidate's own occurrence/mechanism/identity burden. The direct evidence/argument route is explicit and must independently meet the applicable sufficiency template."
  noncomparative_shared_floor: "Use NONCOMPARATIVE_SHARED_FLOOR only for propositions necessary for every admitted full candidate under materially identical truth conditions. P-HIST-JESUS remains conditional on final B4 exclusion of nonhistoricity as a full candidate."
  symmetry: "Analogous propositions use the same route principle across candidates. A candidate's own distinctive mechanism is never treated as established merely because a rival fails."

shared_entries:
  P-HIST-JESUS:
    necessary_test_rationale: "Without a historical subject to whom the event claims refer, none of the admitted Q1 event-origin candidates remains that candidate."
    route: "NONCOMPARATIVE_SHARED_FLOOR"
    discriminator_ids: []
    direct_route: "Historical-source existence/identity route, including explicit node-level consideration of nonhistoricity and source-dependence."
    expected_evidence: "Independent or appropriately dependent historical/textual evidence that a first-century subject identifiable as Jesus is the referent of the crucifixion/resurrection movement claims."
    weakening_evidence: "Failure of subject identity, evidence favoring total nonhistoricity, or provenance/dependence defects sufficient to block the historical proposition."
    lanes: ["L1","L2"]
    coverage_certification: "STUDY and PROPOSITION:P-HIST-JESUS coverage required."
    condition: "Shared-floor classification becomes valid only after frozen B4 exclusion review of nonhistoricity as a full candidate."
  P-EARLY-PROCLAMATION-EXISTENCE:
    necessary_test_rationale: "Every admitted candidate explains an early founding proclamation; without an investigable proclamation there is no common explanandum."
    route: "NONCOMPARATIVE_SHARED_FLOOR"
    discriminator_ids: []
    direct_route: "Historical/textual route establishing the existence, relative chronology, dependence, and recoverable content boundaries of the founding proclamation without presupposing its truth."
    expected_evidence: "Early source/tradition evidence adequate to establish that a founding postmortem-vindication/exaltation/resurrection proclamation existed."
    weakening_evidence: "No recoverable founding proclamation or provenance/dependence failure that prevents identification."
    lanes: ["L1","L2"]
    coverage_certification: "PROPOSITION:P-EARLY-PROCLAMATION-EXISTENCE coverage required."

