review_standard:
  - "Audit each proposition against its exact required strata, acceptable substitutes, expected-access flag, direct/comparative route, and frozen evidence expectations."
  - "Use the L1 matrix as a binding/index artifact, not as proof that the source set is sufficient."
  - "A STUDY-scope materially-complete certification does not automatically make every proposition scope materially complete."
  - "A proposition may be COMPLETE, MATERIALLY_COMPLETE_WITH_LISTED_GAPS, or INCOMPLETE independently of the others."
  - "Unperformed proposition-specific search or a required truth-critical source missing without adequate substitute is COVERAGE_INCOMPLETE."
  - "An access limitation already independently judged non-outcome-changing at STUDY scope may still matter at a proposition scope; decide rather than assume."
  - "If a proposition is materially complete, list the exact residual gaps carried into its later sufficiency/disposition analysis."
  - "If a proposition is incomplete, state the smallest exact acquisition/search defect that must be cured before disposition."
  - "Do not assign any proposition truth disposition."

special_checks:
  - "For body/identity propositions, enforce the frozen separation among embodiment, extramentality, and personal identity."
  - "For founding-encounter/causal propositions, enforce source dependence and founding-stream chronology rather than counting later repetitions."
  - "For L propositions, do not treat later narrative development as evidence of founding interpretive causation without a transmission/development route."
  - "For F propositions, absence of fraud evidence cannot be converted into rival support, but insufficient positive/source coverage must be distinguished from a negative evidential result."
  - "For C-HET propositions, module occurrence and joint-pattern routes must be independently covered; residual fit after pure-candidate failure is not coverage."
  - "Preserve the G1 listed gaps including Crossan/Luedemann/Goulder access, SRC-02 abstract-level dependence controls, Klawans/Boman/Mara/Josephus-Life/Wisdom limitations where proposition-relevant."

prohibited_actions:
  - "Do not assign SUPPORTED, PARTIALLY_SUPPORTED, NOT_ESTABLISHED, EVIDENCE_AGAINST, CONTRADICTED, UNDERDETERMINED, or INSUFFICIENT_SIGNAL proposition dispositions."
  - "Do not apply discriminator direction rules."
  - "Do not certify COMPARISON:<id> MAKEABLE status."
  - "Do not rank candidates."
  - "Do not produce a G3 outcome."
  - "Do not decide whether the resurrection occurred."
  - "Do not draw theological conclusions."
  - "Do not change frozen G0 architecture."
  - "Do not modify the repository."

