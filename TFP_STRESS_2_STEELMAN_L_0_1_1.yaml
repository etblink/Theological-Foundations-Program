native_formulation: "Jesus was crucified and died. The founding proclamation arose primarily through interpretive processing of Jesus's death, inherited scriptural/apocalyptic expectations, memory framing, and theological meaning-making rather than through a necessary founding subjective encounter experience or veridical postmortem referent. M-INTERP was PRIMARY. Individual and social subjective-experience mechanisms were CONTRIBUTING_NONNECESSARY or NONE, and founding deliberate fabrication was NONE. Encounter claims and later narrative detail developed from the interpreted founding proclamation through ordinary transmission/memory/literary processes."

proponent_sources:
  - id: "FORM-L-001"
    title: "Sutton & Le Donne 2023 — Remembering Jesus in Earliest Christianity"
    use: "FORMULATION_ONLY__MECHANISM"
    contribution: "Provides a serious scholarly model of earliest-Christian memory as socially framed, context-sensitive, and actively reconstructed."
  - id: "FORM-L-002"
    title: "Galbraith 2017 — Resurrection in Gospel of Peter as Prophetic Fulfilment of LXX Psalm 18"
    use: "FORMULATION_ONLY__MECHANISM"
    contribution: "Concrete example of resurrection narrative content being generated or reshaped through scriptural interpretation."
  - id: "FORM-L-003"
    title: "Schweitzer, Quest of the Historical Jesus, ch. 8 on Strauss"
    use: "FORMULATION_ONLY__HISTORICAL_THEORY"
    contribution: "Preserves a serious historical legendary/mythic-development family in which resurrection narratives can emerge through communal expectation and development rather than direct event reporting."

  - id: "FORM-L-PROP-001"
    title: "David Friedrich Strauss, The Life of Jesus, Critically Examined — Death and Resurrection of Jesus"
    use: "FORMULATION_ONLY__DIRECT_HISTORICAL_PROPONENT__MYTHIC_LEGENDARY_DEVELOPMENT"
    contribution: "Direct primary proponent source for the legendary/mythic-development family, replacing reliance on Schweitzer's secondary summary as the only access to Strauss."

necessary_propositions:
  - "P-HIST-JESUS"
  - "P-CRUC"
  - "P-DEATH"
  - "P-EARLY-PROCLAMATION-EXISTENCE"
  - "P-L-INTERPRETIVE-ORIGIN"
  - "P-L-EXPERIENCE-NONPRIMARY"
  - "P-L-ENCOUNTER-CLAIM-ORIGIN"
  - "P-L-DEVELOPMENT-SEQUENCE"
  - "P-L-FOUNDING-CAUSAL"

authority_commitments:
  - "Scriptural/theological interpretation is a historical mechanism claim, not a claim that the interpreted scripture is divinely authoritative."
  - "Later literary examples define mechanism plausibility only and are not projected backward into the founding stratum."
  - "L does not infer falsity from development; it bears its own burden to show interpretation was founding-causal."
  - "M-FOUNDING-FAB must be NONE."

internal_success_conditions:
  - "A founding interpretive/scriptural mechanism is independently supported."
  - "M-INTERP is PRIMARY in generating the founding proclamation."
  - "M-IND-EXP and M-SOC-EXP are CONTRIBUTING_NONNECESSARY or NONE; NECESSARY_CONTRIBUTING experience defeats L."
  - "Encounter-claim content is shown to arise from or be shaped by the interpretive/development sequence rather than requiring a founding veridical referent."
  - "A recoverable development/transmission sequence links founding interpretation to later narrative elaboration."
  - "No founding knowing deception is necessary."

expected_evidence:
  - "Early proclamation content that is strongly structured by scriptural/apocalyptic interpretive categories."
  - "Dependence or development patterns showing later encounter/narrative detail emerging from an earlier interpreted proclamation."
  - "Social-memory or literary-development patterns compatible with sincere elaboration rather than deliberate founding fraud."
  - "No independently necessary founding subjective-experience mechanism."

recognized_objections:
  - "Interpretive use of scripture may be post hoc explanation of an already experienced event rather than the founding cause."
  - "A necessary founding individual or social experience routes away from L."
  - "Very early encounter claims may resist a later-development account."
  - "Later narrative creativity does not establish that the founding proclamation itself was interpretation-primary."
  - "A veridical referent could coexist with interpretation and defeat L's nonveridical/no-referent causal account."

caricatures_rejected:
  - "L is not 'the disciples made up myths for no reason'."
  - "L does not require conscious deception."
  - "L does not claim all resurrection language was invented at one late date."
  - "L does not infer that scriptural interpretation is false merely because it is interpretive."

native_or_proponent_review:
  status: "SYNTHETIC_SERIOUS_FORMULATION"
  reviewer_or_basis: "Program-lead review of FORM-L-001 through FORM-L-003 plus NB4 direct-proponent search and FORM-L-PROP-001"
  findings:
    - "Serious memory, scriptural-interpretive and legendary-development mechanisms are represented."
    - "A direct primary proponent source for the legendary/mythic-development family is now included. The exact TFP requirement that interpretation is PRIMARY and subjective experience nonnecessary remains synthetic; a bounded modern exact-match search found no source safe to attribute that strict conjunction to."

equal_strength_review:
