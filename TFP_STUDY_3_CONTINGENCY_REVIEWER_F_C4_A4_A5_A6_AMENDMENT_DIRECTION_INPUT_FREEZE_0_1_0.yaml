amendment_surfaces_to_classify:
  - id: "AMEND-STOPPING-ADEQUACY"
    description: "Restore or make explicit candidate-defining stopping/adequacy burdens omitted or demoted in 0.1.0."
    affected_candidates: ["C-BRUTE","C-REGRESS","C-HOLISTIC","C-SELF-EXPLANATORY","C-NECESSITARIAN","C-NEC-IMPERSONAL-CONCRETE"]
    affected_outcomes: ["A6 necessary proposition burden"]
  - id: "AMEND-FAMILY-STRUCTURE-BOUNDARIES"
    description: "Make family-defining structural and boundary commitments explicit for regress, holistic, agentive, and impersonal-principle families."
    affected_candidates: ["C-REGRESS","C-HOLISTIC","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE"]
    affected_outcomes: ["candidate-boundary fidelity","A6 necessary proposition burden"]
  - id: "AMEND-INDEXICAL-PLURALITY-MODAL-STATUS"
    description: "Require the plurality itself to carry the necessary/non-contingent stopping burden rather than letting indexical actuality alone discharge the family."
    affected_candidates: ["C-INDEXICAL-PLURALITY"]
    affected_outcomes: ["A6 necessary proposition burden"]
  - id: "AMEND-CONTINGENCY-PRESERVATION"
    description: "Make genuine-contingency / anti-modal-collapse burdens explicit and symmetric across necessary-ground families."
    affected_candidates: ["C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE","C-AXIARCHIC"]
    affected_outcomes: ["A6 necessary proposition burden","burden symmetry"]
  - id: "AMEND-SUBSTANTIVE-VS-CONTEXTUAL"
    description: "Reclassify candidate-scope permissions/non-entailments so they do not become unnecessary worldly falsity requirements, while retaining substantive candidate boundaries."
    affected_candidates: ["C-SELF-EXPLANATORY","C-MODAL-DISSOLUTION","C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE","C-AXIARCHIC"]
    affected_outcomes: ["A4 claim typing","A6 necessary proposition burden"]
  - id: "AMEND-DEPENDENCY-SEMANTICS"
    description: "Replace ambiguous dependency arrows with explicit prerequisite, definitional-unpacking, compatibility, boundary, answer-level, and alternative-path semantics."
    affected_candidates: ["C-BRUTE","C-REGRESS","C-HOLISTIC","C-SELF-EXPLANATORY","C-GLOBAL-DEFLATION","C-MODAL-DISSOLUTION","C-INDETERMINATE-ULTIMACY","C-NECESSITARIAN","C-INDEXICAL-PLURALITY","C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE","C-AXIARCHIC"]
    affected_outcomes: ["A5 dependency interpretation","future evidence-link burden"]
  - id: "AMEND-SCOPE-TRUTH-CONDITIONS"
    description: "Sharpen local/domain, total, indexical, ontic-indeterminacy, and necessary-ground scopes so propositions do not silently change strength across families."
    affected_candidates: ["C-GLOBAL-DEFLATION","C-INDETERMINATE-ULTIMACY","C-NECESSITARIAN","C-INDEXICAL-PLURALITY","C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE","C-AXIARCHIC"]
    affected_outcomes: ["A4/A6 proposition scope","burden symmetry"]
  - id: "AMEND-A6-CLASSIFICATION"
    description: "Explicitly classify all 62 enumerated necessary propositions as CANDIDATE_SPECIFIC and retain no presently established SHARED_FLOOR proposition."
    affected_candidates: ["C-BRUTE","C-REGRESS","C-HOLISTIC","C-SELF-EXPLANATORY","C-GLOBAL-DEFLATION","C-MODAL-DISSOLUTION","C-INDETERMINATE-ULTIMACY","C-NECESSITARIAN","C-INDEXICAL-PLURALITY","C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE","C-NEC-IMPERSONAL-PRINCIPLE","C-AXIARCHIC"]
    affected_outcomes: ["A6 candidate-specific/shared-floor classification","future coverage design"]
