coverage_review_standard:
  - "Audit each proposition against its exact required strata, acceptable substitutes, access rules, and actual frozen inventory."
  - "Use the L3 matrix and founding-stream freeze as binding/index artifacts, not as proof of sufficiency."
  - "FS-01 is one received pre-Pauline appearance-tradition cluster for independence/convergence unless separate substream independence is actually warranted."
  - "FS-02, Paul's first-person claimed experience, is not itself a pre-Pauline founding stream."
  - "Later Gospel, Acts, and reception clusters do not become independent pre-Pauline streams merely by repetition."
  - "Keep report existence, sincerity, occurrence, independence, referent reality, personal identity, embodiment, and causal role separate."
  - "Sincerity alone cannot satisfy extramentality or event truth."
  - "Modern bereavement, social-memory, failed-expectation, parapsychology, and testimony literature are reference/mechanism controls; transfer to the first-century target requires explicit warrant."
  - "For R/V occurrence propositions, enforce the same frozen FS-01 stream inventory and the Q1 same-stream rules."
  - "For H/C-HET social and individual experience propositions, do not infer genuine subjective experiences merely from report multiplicity."
  - "For S1 access, do not relabel resurrection/appearance reports as living-Jesus access without positive warrant."
  - "If incomplete, identify the smallest exact acquisition/search defect."

