review_standard:
  - "Audit each proposition against its exact required strata, substitutes, access status, and the actual frozen evidence record."
  - "Use the L4 matrix as an index/binding artifact, not as proof that the sources are sufficient."
  - "Mechanism capacity and prevalence do not establish target-case occurrence."
  - "A target-case explanatory argument may make an occurrence/mechanism route reviewable without making it true."
  - "H-SOC and the social limb of H-SEED/C-HET require genuine nonveridical subjective experiences; report propagation or collective delusion without experiences does not silently satisfy that requirement."
  - "Smith 2024 and Loke/Meader 2025 are opposing target-case arguments to be represented symmetrically."
  - "Do not require inaccessible Luedemann/Goulder originals if the argument-preserving Smith substitute plus adverse control sufficiently exposes the frozen mechanism route."
  - "Memory conformity, collective memory, failed-expectation response, and social contagion are capacities/reference classes unless target-case transfer is separately argued."
  - "For L, distinguish a later development sequence from a founding claim-origin mechanism."
  - "For F, require positive actor-specific warrant for knowing origin-material falsehood; generic deception capacity or motive is insufficient."
  - "For C-HET, module occurrence/capacity/timing must be independently covered and never inferred residually from failure of pure candidates."
  - "If any scope is incomplete, identify the smallest exact remaining acquisition/search defect."

