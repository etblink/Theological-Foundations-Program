rules:
  pre_pauline: "A tradition must be independently source-critically/transmission-dated before Paul's entry into the movement; mere location inside a Pauline letter is insufficient."
  stream_definition: "A distinguishable tradition/experience-report lineage asserted to be causally upstream of or contemporaneous with the founding proclamation; materially dependent reports collapse to one stream."
  same_stream_rule: "Every candidate uses the same stream inventory."
  no_double_counting: "Occurrence, ontology, identity, and causal role are separate burdens."
  later_source_rule: "Gospel, Acts, and early-second-century reception material may preserve, develop, or reinterpret earlier claims but do not become pre-Pauline founding streams merely by repetition."

founding_proclamation_identification:
  stratum_id: "FP-01"
  label: "EARLIEST_RECOVERABLE_RECEIVED_PAULINE_PROCLAMATION_STRATUM"
  anchor_sources: ["G1W1-001","G1W1-002","G1W1-003","G1W1-008"]
  identification:
    - "1 Corinthians 15:3-8 explicitly distinguishes material Paul says he received and delivered."
    - "Galatians 1-2 independently places Paul in contact with Cephas and James and later recognized Jerusalem leaders; this is network/provenance evidence, not proof of the content of their experiences."
    - "The acquired source-critical literature treats at least part of 1 Corinthians 15:3-5/7 as pre-Pauline/traditional, while exact formula boundaries remain disputed."
  frozen_core_for_foundation_analysis:
    content: "The bounded received-tradition core includes death, burial, being raised, and an appearance claim to Cephas; extension through the Twelve and the later named list remains source-critically less secure as one unit."
    boundary_status: "CORE_PRE_PAULINE_OR_EARLIER_THAN_PAULINE_COMPOSITION_MATERIALLY_SUPPORTED__EXACT_FORMULA_BOUNDARY_UNRESOLVED"
  existence_vs_content:
    existence: "An early received proclamation/tradition stratum is materially supported."
    exact_content: "Only the bounded received core above is used without further boundary assumptions."
  geographic_locus: "NOT_FROZEN__NO_UNSUPPORTED_LOCATION_INFERENCE"
  dependence: "One received tradition cluster unless separate lineages are independently established."
  c4_rule: "Re-identification or expansion of the frozen founding stratum after this freeze requires C4."

encounter_stream_inventory:
  - stream_id: "FS-01"
    label: "RECEIVED_PRE_PAULINE_APPEARANCE_TRADITION_CLUSTER"
    anchor_sources: ["G1W1-001","G1W1-008","G1W1-002","G1W1-003"]
    asserted_contents:
      secure_bounded_core:
        - "appearance claim to Cephas"
      additional_received_list_items_preserved_without_independence_assumption:
        - "the Twelve"
        - "more than five hundred"
        - "James"
        - "all the apostles"
    pre_pauline_status: "QUALIFYING_FOR_L3_OCCURRENCE_ANALYSIS__EXACT_INTERNAL_BOUNDARIES_AND_SUBSTREAM_INDEPENDENCE_UNRESOLVED"
    independence_counting: "ONE_STREAM_CLUSTER_FOR_CONVERGENCE_UNLESS_LATER_ANALYSIS_INDEPENDENTLY_WARRANTS_SUBSTREAM_SEPARATION"
    occurrence_status: "PENDING_L3_PROPOSITION_DISPOSITION"
    ontology_status: "UNASSIGNED"
    identity_status: "UNASSIGNED"
    causal_role_status: "UNASSIGNED"
    safeguards:
      - "Named items in the list are not counted as five independent evidential votes."
      - "Paul's received list establishes a transmitted claim structure before it establishes event truth."
      - "R and V use this same stream cluster."

  - stream_id: "FS-02"
