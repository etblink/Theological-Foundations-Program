  - "Distinguish metaphysical coherence/possibility from historical actuality."
  - "For P-R-BODY, verify that EMB-1/EMB-2 can be evaluated under the pre-frozen BGD-11 embodiment variants without letting tomb/body disposition satisfy generic R-TRANS."
  - "For P-R-IDENTITY-JESUS and P-V-IDENTITY-JESUS, enforce the same-referent EMB-3 route and X-REAL-REFERENT-NONIDENTITY node rival; extramentality and embodiment cannot automatically establish identity."
  - "For P-V-REAL-REFERENT, require coverage of subjective-only rivals and the disputed anomalous/extramental reference class without treating psi literature as survival evidence."
  - "For P-V-NONEMBODIED, require that nonembodiment can be assessed separately from real-referent existence and identity."
  - "For H-family nonveridicality propositions, preserve the L3/L4 mechanism evidence but do not let failure of V establish H."
  - "Explicitly audit whether BGD-1, BGD-2, BGD-9, and BGD-11 source/formulation coverage is sufficient to carry later sensitivity analysis."
  - "Use only the eight permitted BGD-11 embodiment×identity pairs and the prospectively narrowed background interaction matrix."
  - "No background is evidence merely because it is live."
  - "If a required philosophical argument/source class remains inaccessible or too thin without an adequate substitute, mark the exact scope COVERAGE_INCOMPLETE and state the smallest return trigger."

