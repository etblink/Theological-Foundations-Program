    argument_map:
      mechanism:
        - "Begins from an individual bereavement hallucination or sense-of-presence experience rather than a shared hallucination."
        - "Treats hallucinations as individual phenomena and the proposed group process as collective delusion/social propagation."
        - "Proposes that the initial experience is communicated to other disciples and spreads through ordinary human discourse/social dynamics."
      timing:
        - "Places the initiating experience after Jesus's sudden violent death and before/subjacent to the expansion of post-resurrection appearance belief."
        - "Connects the process to the early disciples' bereavement, attachment, expectation revision, and subsequent proclamation."
      named_recipients_and_report_targets:
        - "Discusses Peter as the paradigmatic possible initial visionary, while allowing another disciple as the initiating individual."
        - "Discusses Paul's first-person/revelatory experience separately."
        - "Explicitly discusses the Twelve and the 500-plus as collective-appearance targets addressed by the psychological model."
      group_transfer:
        - "Individual stimulus/vision is communicated to other individuals or groups."
        - "The proposal uses collective delusion rather than literal shared hallucination to account for group-level reports."
        - "Smith uses Zeitoun/crowd-social examples as analogical support for an individual-stimulus-to-group-belief transition."
      relation_to_prior_models:
        - "Identifies Luedemann's use of bereavement/mass ecstasy or delusion and Goulder's collective-delusion model."
        - "States that the paper aims to develop the psychological/interdisciplinary basis more fully than those earlier treatments."
    scope_fit_to_return_trigger:
      actual_mechanism_stated: true
      timing_stated: true
      named_recipients_or_targets_stated: true
      group_transfer_claim_stated: true
      argument_level_not_metadata_only: true
    limitations:
      - "The paper is a preprint and its target-case transfer remains an argued reconstruction, not direct observation."
      - "Its analogies to modern bereavement and collective-delusion cases require case-specific transfer and may fail."
      - "It does not create independent founding streams; FS-01 remains one cluster."
