native_formulation: "If R-TRANS is true, the embodied postmortem subject is materially continuous in the relevant sense with the pre-mortem/crucified body rather than being an unrelated or wholly discontinuous embodiment. This is a refinement of R-TRANS, not an N3 competitor and not a truth-warrant gate for generic R_EVENT."

