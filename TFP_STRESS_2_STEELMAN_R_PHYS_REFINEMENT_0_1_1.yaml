  - id: "FORM-R-001"
    title: "Catechism of the Catholic Church, 645-647"
    use: "FORMULATION_ONLY"
    contribution: "Explicit same-body continuity alongside transformed/glorified properties."
  - id: "FORM-R-002"
    title: "William Lane Craig, The Bodily Resurrection of Jesus"
    use: "FORMULATION_ONLY"
    contribution: "Explicit defense of physical/material continuity and critique of purely nonphysical resurrection-body readings."

necessary_propositions:
  - "P-RPHYS-CONTINUITY"

authority_commitments:
  - "Doctrinal or scriptural authority defines proponent meaning only; it does not establish continuity as public evidence."

internal_success_conditions:
  - "R-TRANS is independently satisfied."
  - "P-RPHYS-CONTINUITY is supported under its own evidence route."
  - "The refinement does not create a second status-bearing candidate."

expected_evidence:
  - "Body/tomb/disposition or identity-continuity evidence specifically bearing on continuity of the postmortem body with the crucified body."
  - "Source claims whose meaning, if historically warranted, requires continuity rather than replacement."

recognized_objections:
  - "A transformed embodied state may not require continuity of the same material parts."
  - "Empty-tomb or body-disposition evidence may be historically uncertain or non-diagnostic."
  - "Metaphysical identity theories may permit embodiment without strict material continuity."

caricatures_rejected:
  - "R-PHYS does not mean simple return to ordinary mortal life."
  - "Failure of R-PHYS does not defeat R-TRANS."
  - "The refinement does not license counting the same evidence twice as a sibling candidate."

