family_thesis: "Jesus did not undergo the outcome-material crucifixion event attributed to him, or the identity of the crucified person was materially mistaken/substituted. This family is retained only as a direct serious rival on P-CRUC/crucifixion identity. It receives no founding-proclamation causal credit unless a separately reviewed full candidate is admitted."

native_formulation: "A serious noncrucifixion/crucifixion-identity rival family holds that Jesus himself did not undergo the outcome-material Roman crucifixion attributed to him, or that the crucified person's identity was materially substituted, confused, or misidentified. The family includes tradition-native resemblance/substitution and witness-confusion formulations, a critically described arranged-substitution escape formulation, and a bounded no-substitute noncrucifixion node variant. It is a node-level rival to P-CRUC only; it is not credited with a complete founding-proclamation mechanism unless a separately reviewed full candidate is admitted through C4."

proponent_sources:
  - id: "FORM-S2-001"
    title: "Qur'an 4:157-159"
    use: "FORMULATION_ONLY__TRADITION_NATIVE"
    contribution: "Native scriptural noncrucifixion/resemblance formulation and doubt/assumption argument form."
  - id: "FORM-S2-002"
    title: "IslamQA 10277"
    use: "FORMULATION_ONLY__TRADITION_PROPONENT"
    contribution: "Explicit Sunni resemblance/substitution formulation with Jesus saved/raised rather than crucified."
  - id: "FORM-S23-003"
    title: "IslamQA 224199"
    use: "FORMULATION_ONLY__TRADITIONAL_SURVEY"
    contribution: "Records substitution, mistaken-identification/witness-confusion, and no-disciple-eyewitness argument forms while also reporting Christian appearance claims without adopting them."
  - id: "FORM-S3-001"
    title: "Andrew Loke, Investigating the Resurrection of Jesus Christ, section 5.4"
    use: "FORMULATION_ONLY__CRITICAL_DESCRIPTION"
    contribution: "Critical description of a naturalistic arranged-substitution/escape mechanism; not counted as proponent/native support for a full candidate."


node_level_propositions:
  - "P-CRUC"
  - "P-S2-NOT-CRUCIFIED"
  - "P-S2-SUBSTITUTION-OR-MISIDENTIFICATION"
  - "P-S3-NOT-CRUCIFIED"
  - "P-S3-NO-SUBSTITUTE"

variants:
  - id: "NR-DIVINE-RESEMBLANCE-SUBSTITUTION"
    status: "CONFIRMED_FORMULATION_ONLY"
    formulation: "Jesus is not crucified; another person is made to resemble him or is substituted, while Jesus is saved/raised."
    formulation_sources: ["FORM-S2-001","FORM-S2-002","FORM-S23-003","FORM-S3-001-FOOTNOTE-5"]
    full_candidate_status: "NO"
    reason: "Serious crucifixion-identity formulation exists, but no traceable closed founding-proclamation mechanism was established."
    expected_evidence:
      - "Identity/provenance evidence consistent with Jesus not being the crucified subject and with another person being taken for him."
      - "Independent evidence of resemblance/substitution or witness/transmission confusion material to crucifixion identity."
    weakening_evidence:
      - "Independent, convergent identification of Jesus as the crucified subject under the same source-quality and dependence rules."
      - "Failure to establish any substitution/resemblance or identity-confusion route beyond authority assertion."

  - id: "NR-GNOSTIC-RESEMBLANCE-SUBSTITUTION"
    status: "CONFIRMED_AS_REPORTED_TRADITION"
    formulation: "A look-alike or other person is crucified instead of Jesus."
    formulation_sources: ["FORM-S23-003","FORM-S3-001-FOOTNOTE-5"]
    full_candidate_status: "NO"
    source_limit: "Current program record relies on critical/secondary reporting rather than a newly acquired native Gnostic text."
    expected_evidence:
      - "Traceable evidence that a serious Gnostic/look-alike formulation bears on the identity of the crucified subject."
      - "Any independently accessible formulation detail that generates testable crucifixion-identity consequences."
    weakening_evidence:
      - "No independent warrant for the reported look-alike/substitution formulation beyond secondary reporting."
      - "Evidence strongly identifying Jesus as the crucified subject under equal source-quality rules."

  - id: "NR-NATURALISTIC-ARRANGED-SUBSTITUTION-ESCAPE"
    status: "CONFIRMED_CRITICAL_DESCRIPTION_ONLY"
    formulation: "Jesus secretly escapes before crucifixion; another person is crucified in his place; Jesus later appears to disciples and convinces them he has risen."
    formulation_sources: ["FORM-S3-001"]
    full_candidate_status: "NOT_ESTABLISHED"
    B3_limit: "The permitted source is a critic, not a proponent/native formulation. The founding mechanism therefore routes to revised-candidate fallback if outcome-material."
    reopen_if: "A proponent/native formulation independently satisfies B1/B3."
    expected_evidence:
      - "Evidence of a pre-crucifixion escape and an arranged substitute/misidentified victim sufficient to bear on P-CRUC."
      - "If the founding mechanism is later considered, proponent/native evidence independently supporting the later-appearance/deception chain."
    weakening_evidence:
      - "Evidence identifying Jesus himself as the crucified subject."
      - "Failure to find any proponent/native basis for the arranged-substitution founding mechanism; this limits it to node-rival status."

  - id: "NR-MISTAKEN-IDENTIFICATION-OR-WITNESS-CONFUSION"
    status: "CONFIRMED_FORMULATION_ONLY"
    formulation: "Witnesses, crucifiers, or later transmitters are mistaken or confused about the identity of the crucified person."
    formulation_sources: ["FORM-S23-003"]
    full_candidate_status: "NO"
    expected_evidence:
      - "Witness/provenance patterns supporting material uncertainty or mistaken identity about the crucified subject."
      - "Independent evidence that named observers, executors, or transmitters lacked reliable identity access."
    weakening_evidence:
      - "Independent, convergent subject identification of Jesus across materially independent evidential streams."
      - "Evidence that alleged identity uncertainty is created only by later doctrinal assertion rather than historical provenance."

  - id: "NR-NO-SUBSTITUTE-NONCRUCIFIXION"
    status: "REVIEWER_A_RECLASSIFIED_NODE_VARIANT__NO_NATIVE_FULL_FORMULATION"
    formulation: "Jesus is not crucified and no substitute victim is part of the claim."
    formulation_sources: ["FORM-S2-001_BOUNDARY_ONLY","FORM-S23-003_BOUNDARY_ONLY"]
    full_candidate_status: "NO"
    traceability_limit: "No permitted source supplied the former S3 full conjunction of no substitute + continued life + later founding access. The variant is retained only as a P-CRUC node challenge and not as a complete causal model."
    expected_evidence:
      - "Independent evidence that Jesus did not undergo the attributed crucifixion without requiring a substitute-victim mechanism."
      - "A traceable noncrucifixion mechanism or identity route that bears directly on P-CRUC while remaining distinct from substitution."
    weakening_evidence:
      - "Absence of any independently defensible no-substitute formulation or mechanism."
      - "Independent, convergent identification of Jesus as the crucified subject."

  - id: "NR-DISTINCT-NON_SUBSTITUTION_CONFUSION"
    status: "NOT_SEPARATELY_CONFIRMED"
    formulation: null
    rule: "Do not count as a distinct variant unless a future permitted formulation source clearly distinguishes it from substitution/misidentification."

native_argument_forms:
  use: "FORMULATION_ONLY"
  rule: "These are preserved as the rival family's own argument forms for steelman fidelity. They are not historical proposition dispositions and are not pre-applied as evidence."
  forms:
    - id: "ARG-RESEMBLANCE-MISIDENTIFICATION"
      formulation: "The crucified person was another person or was materially mistaken for Jesus."
      sources: ["FORM-S2-001","FORM-S2-002","FORM-S23-003"]
    - id: "ARG-WITNESS-CONFUSION"
      formulation: "Onlookers, crucifiers, or later transmitters could be confused or mistaken about the identity of the crucified person."
      sources: ["FORM-S23-003"]
    - id: "ARG-DOUBT-ASSUMPTION"
      formulation: "The tradition-native formulation explicitly appeals to doubt/assumption rather than secure knowledge concerning the crucifixion attribution."
      sources: ["FORM-S2-001","FORM-S23-003"]
    - id: "ARG-NO-DISCIPLE-EYEWITNESS"
      formulation: "The reviewed traditional argument challenges direct disciple eyewitness access to the crucifixion and uses that absence as part of its identity/transmission critique."
      sources: ["FORM-S23-003"]

internal_success_conditions:
  - "At least one serious noncrucifixion, substitution, misidentification, or witness-confusion formulation is represented at steelman quality."
  - "P-CRUC receives a direct sufficiency record that tests affirmative crucifixion attribution against the live node-rival variants under equal provenance, dependence, identity, and source-quality rules."
  - "No variant receives founding-proclamation causal credit merely by defeating or weakening P-CRUC."
  - "Critical descriptions are not misrepresented as proponent/native endorsement."
  - "The family remains bounded to crucifixion identity unless a separately reviewed revised candidate is triggered."

expected_evidence:
  - "Identity/provenance evidence materially supporting substitution, misidentification, witness confusion, or another traceable noncrucifixion route."
  - "Evidence that observers, executors, or transmitters lacked reliable access to the crucified person's identity."
  - "For an arranged-substitution escape variant, independent support for pre-crucifixion escape/substitution sufficient to bear on P-CRUC."
  - "For a no-substitute variant, an independently defensible noncrucifixion route distinct from mere abstract possibility."

recognized_objections:
  - "The tradition-native sources are much later than the event and are formulation sources, not historical evidence by authority."
  - "The arranged-substitution escape mechanism is currently known from a critic's description rather than a proponent/native formulation, so it cannot be promoted to a full candidate under B3 on this record."
  - "Independent convergent identification of Jesus as the crucified subject would weaken all variants."
  - "A node-level noncrucifixion rival does not by itself explain the founding resurrection proclamation."
  - "A distinct no-substitute formulation remains thin and may fail traceability if no independent formulation route exists."

caricatures_rejected:
  - "The family is not reduced to 'Muslims deny the crucifixion'."
  - "The family does not treat religious authority as historical proof."
  - "The family does not assume every noncrucifixion view requires a supernatural substitute."
  - "The family does not automatically become a full origin theory if P-CRUC weakens."
  - "The family is not defeated merely because one substitution variant fails; each registered variant is tested under its own formulation limits."

authority_commitments:
  - "Religious/traditional authority defines formulation only and is not public historical evidence by authority."
  - "Critical descriptions may establish that a rival has been discussed but cannot by themselves satisfy B3 for a full candidate."
  - "No node-rival variant is credited with explaining the founding proclamation."

