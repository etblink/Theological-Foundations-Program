native_formulation: "Jesus was crucified and died. One or more actors necessary to the founding proclamation knowingly asserted or constructed an origin-material resurrection/encounter claim they understood to be materially false, with the intention or accepted effect that the movement receive it as true. M-FOUNDING-FAB was PRIMARY. A body-removal/concealment implementation is frozen only as the non-status F-BODY-REMOVAL implementation refinement below; it cannot be switched on opportunistically after exposure."

proponent_sources:
  - id: "FORM-F-001"
    title: "Hermann Samuel Reimarus — Fragments, resurrection-fraud discussion"
    use: "FORMULATION_ONLY__HISTORICAL_PROPONENT"
    contribution: "Historical explicit deception model in which disciples could remove Jesus's body and knowingly proclaim resurrection."
  - id: "FORM-F-002"
    title: "Albert Schweitzer — Quest of the Historical Jesus, ch. 2 on Reimarus"
    use: "FORMULATION_ONLY__SECONDARY_PROVENANCE"
    contribution: "Confirms the structure and historical seriousness of Reimarus's theory while also making clear that it is a specific historical theory rather than a default skeptical assumption."

necessary_propositions:
  - "P-HIST-JESUS"
  - "P-CRUC"
  - "P-DEATH"
  - "P-EARLY-PROCLAMATION-EXISTENCE"
  - "P-F-DELIBERATE"
  - "P-F-ORIGIN-MATERIAL"
  - "P-F-MOTIVE-OPPORTUNITY-ROUTE"
  - "P-F-TRANSMISSION-SUFFICIENT"
  - "P-F-FOUNDING-CAUSAL"

authority_commitments:
  - "Suspicion, motive, inconsistency, or later literary embellishment does not establish knowing deception."
  - "F requires positive warrant for origin-material knowing falsehood and a viable motive/opportunity/transmission route."
  - "Historical polemic against Christianity is formulation context only, not evidence by authority."
  - "Mere memory error, symbolic literature, sincere interpretation, or later non-origin elaboration is not F."

internal_success_conditions:
  - "At least one founding actor necessary to the proclamation knowingly asserts or constructs a materially false origin claim."
  - "The deception is origin-material rather than later-only."
  - "A motive/opportunity/implementation route is independently supported at adequate strength."
  - "Transmission from the deception into the founding proclamation is sufficient."
  - "M-FOUNDING-FAB is PRIMARY under the common causal-role ladder."
  - "The model does not rely merely on failure of R/V/H/L."

registered_implementation_partition:
  closed_set: ["F-NONBODY-ASSERTION","F-BODY-REMOVAL"]
  no_posthoc_third_implementation: true
  success_rule: "P-F-MOTIVE-OPPORTUNITY-ROUTE requires at least one frozen implementation to be independently SUPPORTED_WITHIN_SCOPE; weakness of one does not support the other."

  F-NONBODY-ASSERTION:
    status: "BASELINE_NON_STATUS_IMPLEMENTATION"
    registered_before_G0: true
    proposition: "A founding actor knowingly originates or constructs a materially false resurrection/encounter assertion without any necessary corpse-removal, concealment, or body-disposition action."
    direct_burden: "Positive actor-specific warrant for knowing falsehood plus opportunity/access to originate the false assertion and a viable path by which that assertion enters the founding proclamation. Body evidence supplies no support or adverse weight to this implementation."
    expected_evidence:
      - "actor-linked evidence bearing on knowing falsehood rather than sincere mistake"
      - "opportunity/access to originate the relevant assertion"
      - "a traceable transmission route into founding proclamation material"
    weakening_conditions:
      - "no supported actor-level knowing falsehood"
      - "no viable opportunity/access or transmission implementation under adequate coverage"
      - "a necessary veridical founding encounter, which routes to REVISED_CANDIDATE_REQUIRED"
    body_evidence_binding: "NEUTRAL"

  F-BODY-REMOVAL:
    status: "NON_STATUS_IMPLEMENTATION_REFINEMENT"
    registered_before_G0: true
    proposition: "A founding actor participating in the deception deliberately removed, concealed, or redirected corpse/body-disposition evidence as part of the founding deception implementation."
    direct_burden: "Independent evidence connecting founding actors to removal/concealment plus P-F-DELIBERATE and P-F-ORIGIN-MATERIAL."
    positive_use_rule: "Body-removal evidence may contribute to P-F-MOTIVE-OPPORTUNITY-ROUTE only through this registered implementation."
    weakening_rule: "Materially contrary body-disposition evidence weakens or closes F-BODY-REMOVAL and cannot be ignored while favorable body evidence is credited."
    body_evidence_binding: "SYMMETRIC_WITHIN_THIS_IMPLEMENTATION"

  closure_rule: "Closure of F-BODY-REMOVAL leaves generic F dependent solely on the already-registered F-NONBODY-ASSERTION implementation. Body evidence cannot be borrowed by F-NONBODY-ASSERTION. If neither frozen implementation is supported, P-F-MOTIVE-OPPORTUNITY-ROUTE is below SUPPORTED and F is ranking-blocked."

veridical_encounter_boundary:
  rule: "F excludes any veridical founding encounter/referent at PRIMARY or NECESSARY_CONTRIBUTING causal strength. If founding knowing deception and a necessary veridical encounter are both warranted, the result is REVISED_CANDIDATE_REQUIRED, not F."

expected_evidence:
  - "Direct or circumstantial evidence of knowing falsehood by founding actors, not merely incorrect belief."
  - "A feasible opportunity and implementation route for the specific deception claimed."
  - "Transmission patterns consistent with the fabricated claim becoming founding material."
  - "For F-NONBODY-ASSERTION: actor-specific knowing-falsehood, opportunity/access, and transmission evidence independent of body disposition."
  - "For F-BODY-REMOVAL only: independent body-disposition evidence connecting founding actors to removal/concealment, with materially contrary body evidence weakening or closing that implementation."

recognized_objections:
  - "Sincere conviction, costly behavior, or lack of motive may weaken a deception model but do not automatically disprove it."
  - "Later invention cannot satisfy founding-stratum deception."
  - "F-BODY-REMOVAL does not by itself explain encounter claims unless deception/transmission burdens are met; materially contrary body evidence closes that implementation. Closure leaves only the preregistered F-NONBODY-ASSERTION route."
  - "The historical Reimarus model may be too specific; the frozen F candidate therefore keeps deliberate founding deception broader than body theft while preserving a positive implementation burden."
  - "No modern mechanism literature reviewed here establishes that the relevant founders deceived."

caricatures_rejected:
  - "F is not 'the disciples lied because skeptics say so'."
  - "F does not treat every theological development as fraud."
  - "F does not assume a body theft."
  - "F does not equate error or sincere legend with deception."

