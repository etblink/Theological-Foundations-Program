    - "The packet broadens beyond Reimarus's specific body-theft implementation only enough to match the frozen F proposition set; every broader implementation still bears explicit motive/opportunity/transmission burdens."
    - "Contemporary scholarly endorsement is not claimed."

equal_strength_review:
