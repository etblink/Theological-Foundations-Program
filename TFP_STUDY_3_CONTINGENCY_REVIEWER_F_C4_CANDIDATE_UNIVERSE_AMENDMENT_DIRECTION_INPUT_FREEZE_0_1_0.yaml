amendment_surfaces_to_classify:
  - id: "AMEND-HOLISTIC-SELF"
    description: "Narrow C-HOLISTIC to mutual/structural/non-reflexive non-well-founded explanation and sharpen C-SELF-EXPLANATORY as item-reflexive."
    affected_candidates: ["C-HOLISTIC","C-SELF-EXPLANATORY"]
  - id: "AMEND-DEFLATION-DISSOLUTION"
    description: "Restrict C-MODAL-DISSOLUTION to modal contingency-presupposition failure and move genuine-contingency explanatory-demand deflation into C-GLOBAL-DEFLATION."
    affected_candidates: ["C-MODAL-DISSOLUTION","C-GLOBAL-DEFLATION"]
  - id: "AMEND-INDETERMINATE"
    description: "Add C-INDETERMINATE-ULTIMACY as a distinct candidate with explicit B6 boundary."
    affected_candidates: ["C-INDETERMINATE-ULTIMACY"]
    affected_outcomes: ["candidate-universe completeness","future comparative universe size"]
  - id: "AMEND-NOMOLOGICAL-ANCHOR"
    description: "Anchor nomological-but-not-metaphysically-necessary ultimacy under C-BRUTE rather than as a standalone family."
    affected_candidates: ["C-BRUTE"]
  - id: "AMEND-AXIARCHIC-BOUNDARY"
    description: "Make explicit that axiarchic requiredness is impersonal and not the perfect goodness of a personal agent or God-identity."
    affected_candidates: ["C-AXIARCHIC"]
  - id: "AMEND-EXCLUSIONS"
    description: "Freeze explicit B4 exclusions for partitioned ultimacy, dialetheic/impossible-existence, standalone nomological ultimacy, plural/layered necessary foundations as standalone, classical-theism/deism/pantheism/panentheism labels, physics-specific cosmologies, epistemic abstention, and no-concrete-reality."
    affected_outcomes: ["candidate-universe completeness","future B5 late-candidate handling"]
  - id: "AMEND-UNSPLIT-PRINCIPLE-PLURALITY"
    description: "Preserve impersonal-principle forms as subvariants and plurality/layering as cross-cutting rather than standalone families."
    affected_candidates: ["C-NEC-IMPERSONAL-PRINCIPLE","C-NEC-IMPERSONAL-CONCRETE","C-NEC-AGENTIVE"]

task:
  - "Verify from the ledger whether the amendment bundle occurred before any outcome-relevant evidence exposure."
  - "For every amendment surface and every affected candidate/outcome condition, assign ADVERSE, FAVORABLE, NEUTRAL, or MIXED_OR_UNCLEAR."
  - "Explain direction relative to the candidate/outcome condition, not relative to a worldview."
  - "Assign the C4 amendment class from the chronology and direction findings."
  - "Determine whether Protocol C4 permits the repaired register/exclusion record to be used prospectively once ledger integrity is independently verified."
  - "Identify any directional asymmetry or hidden favorable repair that would require a different treatment."
  - "Do not reassess B1 completeness except where necessary to classify an amendment's direction."
  - "Do not rank candidates, investigate evidence, or adjudicate truth."

