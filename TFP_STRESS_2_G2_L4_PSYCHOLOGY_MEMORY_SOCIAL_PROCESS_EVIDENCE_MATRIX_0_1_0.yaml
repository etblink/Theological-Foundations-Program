source_clusters:
  P1_INDIVIDUAL_BEREAVEMENT_MECHANISMS:
    source_ids: ["G1RS-059","G1RS-072","G1RS-073","G2L3R-001","G2L3R-002"]
    observations:
      - "Bereavement sensory experiences and sensed-presence phenomena are empirically documented as genuine experiences in modern populations."
      - "Smith 2024 supplies a target-case proposal of an individual bereavement vision as a possible initiating stimulus."
      - "Loke/Meader 2025 provides full peer-reviewed adverse testing of the transfer from modern bereavement phenomena to the Jesus case."
    limits:
      - "Capacity and prevalence do not establish target-case occurrence."
      - "Luedemann/Goulder originals remain full-text inaccessible."
  P2_SOCIAL_MEMORY_AND_GROUP_PROCESS:
    source_ids: ["G1RS-060","G1RS-061","G1RS-068","G2L3R-001","G2L3R-002"]
    observations:
      - "Memory conformity, social contagion, collective-memory processes, and failed-expectation group responses are independently documented."
      - "Smith proposes individual-stimulus-to-group-belief propagation through suggestion, discourse, and collective delusion rather than literal shared hallucination."
      - "Loke/Meader argues that MPI/collective-delusion analogies and shared-perception transfer do not map cleanly to the target case."
    limits:
      - "Generic group mechanisms are not direct evidence of an early-Christian founding social process."
      - "Collective delusion/report propagation does not by itself satisfy modules requiring genuine subjective experiences across the social process."
  P3_MEMORY_AND_NARRATIVE_DEVELOPMENT:
    source_ids: ["G1RS-062","G1RS-070","G1W1-001","G1W1-006","G1W1-019","G1W1-020","G1W1-021"]
    observations:
      - "The acquired record supports memory/narrative processes as general capacities and documents increasingly elaborated resurrection narratives across later literary strata."
      - "Gospel of Peter supplies an especially explicit later noncanonical elaboration."
    limits:
      - "Observed literary difference does not by itself establish the psychological mechanism or exact genealogy producing it."
      - "Later elaboration cannot retroactively create a founding causal mechanism."
  P4_DECEPTION_AND_FABRICATION_CONTROLS:
    source_ids: ["G1RS-063","G1W1-019","G1RS-071"]
    observations:
      - "Modern deception research warns against inference of knowing falsehood from generic behavioral cues."
      - "Matthew preserves a stolen-body counterclaim tradition and Crossan argues for later invention/development on burial-related material."
    limits:
      - "No acquired evidence directly demonstrates actor-specific founding knowing deception."
      - "Later invention or literary development is not automatically founding fabrication."
  P5_TARGET_CASE_POSITIVE_ADVERSE_PAIR:
    source_ids: ["G2L3R-001","G2L3R-002"]
    observations:
      - "The positive paper supplies explicit mechanism, timing, recipients/targets, and group-transfer claims."
      - "The adverse paper contests case transfer, MPI mapping, shared-perception fit, and cognitive-dissonance analogies."
    limits:
      - "Disagreement makes the mechanism testable, not decided."
      - "Neither paper can change the frozen FS-01 dependence structure."
  P6_TIMING_AND_STREAM_CONTROL:
    artifacts:
      - "TFP_STRESS_2_G2_FOUNDING_PROCLAMATION_AND_ENCOUNTER_STREAM_IDENTIFICATION_FREEZE_0_1_0.yaml"
      - "TFP_STRESS_2_G2_L1_TEXTUAL_SOURCE_CRITICAL_LANE_FREEZE_0_1_1.yaml"
      - "TFP_STRESS_2_G2_L2_HISTORICAL_EVENT_LANE_FREEZE_0_1_0.yaml"
      - "TFP_STRESS_2_G2_L3_TESTIMONY_CLAIMED_ENCOUNTER_LANE_FREEZE_0_1_0.yaml"
    observations:
      - "FS-01 remains one pre-Pauline received appearance-tradition cluster."
      - "Mechanism capacity is evaluated against the frozen founding stratum rather than against later narrative multiplicity."
      - "L2 supports death within scope, so bereavement-based mechanisms have their ordinary precondition available without thereby being established as operative."

