  L5_philosophy_metaphysics:
    status: "PROGRAM_LEAD_COORDINATED"
  L6_comparative_integration:
    status: "PROGRAM_LEAD"

human_relaying_operator:
  actor_lineage: "HUMAN_OWNER_RELAY_OPERATOR"
  permitted:
    - "relay frozen prompts"
    - "relay immutable source identities"
    - "relay final reviewer reports"
  prohibited_for_independence:
    - "inject substantive outcome-material determinations from one reviewer into another before freeze"
    - "rewrite reviewer conclusions while relaying"

assignment_sequence:
  - step: 1
    role: "REVIEWER_A"
    action: "obtain assignment acceptance, then run blind candidate/background/typing elicitation without showing program-lead candidate list"
  - step: 2
    role: "PROGRAM_LEAD"
    action: "version pre-evidence preregistration using REVIEWER_A frozen output"
  - step: 3
    role: "REVIEWER_B"
    action: "review necessary-proposition map, source plan, insufficiency threshold, and assigned B-surface controls"
  - step: 4
    role: "REVIEWER_C"
    action: "review discriminator tiers/direction rules, background interactions, and assigned C-surface controls"
  - step: 5
    role: "PROGRAM_LEAD"
    action: "freeze final G0 bundle and return exact bundle to human owner"
  - step: 6
    role: "HUMAN_OWNER"
    action: "authorize or reject exact G0 bundle"
  - step: 7
    role: "ALL"
    action: "G1 may begin only after explicit G0 authorization"

g0_role_gate:
  ready_for_human_authorization: false
  blockers:
    - "REVIEWER_A assignment acceptance and blind review not yet frozen"
    - "REVIEWER_B actual actor/session provenance not yet assigned"
    - "REVIEWER_C actual actor/session provenance not yet assigned"
    - "outcome-material G0 reviews not yet completed"
  evidence_acquisition_before_clearance: "PROHIBITED"
