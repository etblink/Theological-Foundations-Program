    effect: "Retain a node-level traditional substitution rival and separately admit a fully specified status-bearing synthetic candidate only if the synthetic founding mechanism independently satisfies B1/SERIOUS_RIVAL."
  - id: "D"
    label: "EXCLUDE_S2_FULL_CANDIDATE"
    effect: "Exclude the current full candidate if neither B nor C can satisfy the candidate rules; preserve relevant node-level propositions."

program_lead_recommendation:
