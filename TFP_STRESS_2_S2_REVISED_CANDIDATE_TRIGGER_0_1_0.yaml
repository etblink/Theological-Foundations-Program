  - "Removing the access burden without review would make S2 materially weaker after admission freeze."
  - "Keeping the access burden while calling it tradition-native would misrepresent the serious rival."
  - "The protocol's candidate completeness and equal-strength rules therefore require candidate-lineage review."

bounded_reviewer_A_options:
