    label: "RECLASSIFY_SUBSTITUTION_AS_NODE_RIVAL"
    effect: "Remove S2 from status-bearing candidates; preserve substitution/misidentification as a serious rival on P-CRUC/P-S2-NOT-CRUCIFIED and related identity propositions. Do not pretend it independently explains the founding proclamation."
