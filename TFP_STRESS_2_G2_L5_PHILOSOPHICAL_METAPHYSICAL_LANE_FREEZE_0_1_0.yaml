  - "V remains metaphysically coherent: a real nonembodied referent is not ruled out by the frozen background set. Yet no first-century extramental referent or nonembodiment state is independently established."
  - "The nonidentity node rival prevents either R or V from converting referent reality/embodiment into Jesus-identity automatically."
  - "H-IND and H-SEED nonveridicality remain philosophically plausible but target-case unattested; H-SOC remains not established because its own genuine-social-experience requirement is unmet."
  - "Anomalous-information/psi literature remains only a disputed reference class and carries no direct Jesus-case weight."
  - "No BGD-1, BGD-2, BGD-9, or BGD-11 variant is promoted into the study as a preferred worldview."

