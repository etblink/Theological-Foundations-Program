  - "Extramentality and nonveridicality remain genuine rivals under different background/epistemic assumptions; L5 alone does not resolve D4."
  - "Nonembodied survival can be coherent without being evidenced in the target case."
  - "Background sensitivity must be carried into Phase-L/G3 rather than collapsed into a single assumed ontology."

