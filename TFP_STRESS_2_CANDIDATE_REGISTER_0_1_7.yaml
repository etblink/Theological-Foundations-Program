      permitted_nonnecessary: ["M-IND-EXP","M-INTERP","M-LATER-NARR","M-BODY"]
      prohibited_foundational: ["M-FOUNDING-FAB"]
    seed_then_spread_boundary: "If M-IND-EXP is PRIMARY or NECESSARY_CONTRIBUTING together with M-SOC-EXP while M-INTERP is nonnecessary, H-SOC fails and H-SEED-SPREAD is the admitted candidate. If M-INTERP is also necessary, use C-HET-SEED-SPREAD."
    body_disposition_expectation: "No body/tomb proposition is necessary; packet expectations govern any body-evidence use."
    q1_relation: "Denies P-R-BODY and P-V-REAL-REFERENT."

  - id: "H-SEED-SPREAD"
    family: "H"
    name: "Subjective individual-seed plus social-amplification origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical individual subjective experience and a distinct social/group amplification process were each PRIMARY or NECESSARY_CONTRIBUTING to the founding proclamation, with at least one PRIMARY; interpretive processing was only CONTRIBUTING_NONNECESSARY or NONE; no founding fabrication was necessary."
