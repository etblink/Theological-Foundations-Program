status_bearing_candidates:
  - id: "R-TRANS"
    canonical_name: "R-EMBODIED-GENERIC"
    family: "R"
    name: "Generic embodied post-death event"
    status_bearing: true
    relation_to_R_PHYS: "R-PHYS is a nested non-status-bearing refinement. It never competes with R-TRANS under N3."
    core: "Jesus was crucified, genuinely died, and subsequently existed as the same personal subject in an embodied postmortem state satisfying EMB-1 through EMB-3; at least one pre-Pauline founding encounter stream involving that embodied Jesus was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-R-BODY"
      - "P-R-FOUNDING-ENCOUNTER"
      - "P-R-CAUSAL"
    body_disposition_expectation: "No specific tomb/body-disposition proposition is necessary to R-TRANS unless frozen in its steelman packet. Body-disposition evidence may support or weaken R only through a registered expectation tied to EMB-1/2/3 or another necessary proposition."
    q1_relation: "This is the sole status-bearing affirmative R_EVENT candidate."
    truth_warrant_rule: "TRUTH_WARRANTED may attach directly to R-TRANS if its necessary propositions and all protocol conditions are met; no R-PHYS/R-TRANS sibling dominance is required."

  - id: "V"
    family: "V"
    name: "Veridical non-embodied postmortem encounter"
    status_bearing: true
    core: "Jesus was crucified and died; at least one real extramental postmortem referent identical with Jesus existed in a non-embodied mode and a corresponding founding encounter stream was a PRIMARY or NECESSARY_CONTRIBUTING cause of the founding proclamation."
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-V-REAL-REFERENT"
      - "P-V-IDENTITY-JESUS"
      - "P-V-NONEMBODIED"
      - "P-V-FOUNDING-CAUSAL"
    body_disposition_expectation: "No empty-tomb/body-disposition claim is necessary to V. Body evidence is neutral unless its packet registers a candidate-specific expectation."
    causal_agent_scope: "Q2 is deferred; V does not gain or lose admission based on whether the non-embodied referent is explained theistically or non-theistically."
    q1_relation: "Denies P-R-BODY because it fails EMB-1 or EMB-2."

  - id: "H-IND"
    family: "H"
    name: "Subjective individual-experience origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical individual subjective experiences occurred in the founding stratum and M-IND-EXP was PRIMARY; social and interpretive processes were at most CONTRIBUTING_NONNECESSARY."
    causal_profile_ref: "H-IND"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-HIND-EXPERIENCE-OCCURRED"
      - "P-HIND-NONVERIDICAL"
      - "P-HIND-MECHANISM-SUFFICIENT"
      - "P-HIND-FOUNDING-CAUSAL"
    closed_mechanism_list:
      required: ["M-IND-EXP"]
      permitted_nonnecessary: ["M-SOC-EXP","M-INTERP","M-LATER-NARR","M-BODY"]
      prohibited_foundational: ["M-FOUNDING-FAB"]
    body_disposition_expectation: "No body/tomb proposition is necessary. Any claimed body evidence is evaluated independently and cannot strengthen H-IND unless a packet expectation is frozen."
    q1_relation: "Denies P-R-BODY and P-V-REAL-REFERENT."

  - id: "H-SOC"
    family: "H"
    name: "Subjective social/group-experience origin"
    status_bearing: true
    core: "Jesus was crucified and died; genuine non-veridical subjective experiences occurred in a social/group process and M-SOC-EXP was PRIMARY; an individual seed and interpretation were at most CONTRIBUTING_NONNECESSARY."
    causal_profile_ref: "H-SOC"
    necessary_propositions:
      - "P-HIST-JESUS"
      - "P-CRUC"
      - "P-DEATH"
      - "P-EARLY-PROCLAMATION-EXISTENCE"
      - "P-HSOC-GENUINE-SUBJECTIVE-EXPERIENCES"
      - "P-HSOC-SOCIAL-PROCESS-OCCURRED"
      - "P-HSOC-NONVERIDICAL"
      - "P-HSOC-MECHANISM-SUFFICIENT"
      - "P-HSOC-FOUNDING-CAUSAL"
