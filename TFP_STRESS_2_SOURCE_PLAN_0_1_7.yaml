absence_rule:
  symmetric: true
  text: "Absence is evaluated under Protocol E2 for every candidate. Neither presence nor absence of attestation is automatically probative. Expected-but-absent evidence is probative only under a frozen expectation that applies symmetrically."
  non_extant_rule: "Under otherwise complete coverage, non-survival of a class not predesignated expected-extant yields the applicable proposition disposition (including NOT_ESTABLISHED, PLAUSIBLE_BUT_UNATTESTED, or UNDERDETERMINED), not INSUFFICIENT_SIGNAL. MISSING_CRITICAL_EVIDENCE is reserved for a predesignated truth-critical/expected-extant class whose absence or inaccessibility prevents a required rule from being applied."

inaccessible_source_rule:
  - "At freeze, each truth-critical proposition names required strata and acceptable substitutes."
  - "If a required stratum is inaccessible but a predesignated adequate substitute is available, use the substitute and disclose the gap."
  - "If a predesignated truth-critical stratum is genuinely inaccessible/unidentifiable and no substitute exists, the dependent rule may route to INSUFFICIENT_SIGNAL after a documented effort record."
  - "Accessible, provenance-adequate but weak/neutral evidence never becomes INSUFFICIENT_SIGNAL merely because it fails to favor a candidate."
  - "Unperformed search is COVERAGE_INCOMPLETE and cannot close as INSUFFICIENT_SIGNAL."
  - "Bounded dating/authorship/dependence uncertainty that can be propagated through sensitivity/confidence is not provenance failure."
  - "Provenance failure means the item cannot be identified well enough to apply the relevant type-specific mandatory element at all."

adverse_source_probe_plan:
  reviewer_role: "REVIEWER_C"
  requirement: "Before COMPLETE or MATERIALLY_COMPLETE coverage, use at least one credible external index/citation trail or critical stream not used to construct the original source plan, specifically searching for omitted adverse evidence/source classes."
  no_result_rule: "A null probe is recorded; it does not prove candidate truth."

