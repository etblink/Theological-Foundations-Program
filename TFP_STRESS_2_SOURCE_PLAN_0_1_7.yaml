scope:
  event_window: "Early first century CE crucifixion period through the emergence of the founding proclamation and founding claimed-encounter streams."
  evidence_window: "First-century evidence plus material through approximately 150 CE where relevant to transmission, dependence, reception, or development. Later material may be used for formulation, textual transmission, reception, or methodological comparison but is not silently projected backward."
  geography: "Roman Judea/Galilee, Jerusalem, and relevant eastern Mediterranean networks; other regions only where provenance/transmission requires."
  languages:
    - "Koine Greek"
    - "Aramaic/Hebrew substrate claims where outcome-material"
    - "Latin where Roman evidence is outcome-material"
  exclusions:
    - "global truth of Christianity"
    - "Trinity/atonement/inerrancy/denominational authority"
    - "specific divine-agent attribution as an active Q1 comparison"
    - "unrelated later miracle claims"

repositories_or_corpora_policy:
  primary_text_and_manuscript_routes:
    - "critical editions and manuscript apparatus appropriate to the relevant ancient text"
    - "INTF/NT.VMR or equivalent manuscript resources where accessible for New Testament textual questions"
    - "Perseus, Loeb, TLG, or equivalent classical/Jewish/Greco-Roman corpora where accessible"
    - "published corpora/critical editions for early Jewish and early Christian sources"
  scholarly_search_routes:
    - "ATLA Religion Database or equivalent religion/biblical-studies index where accessible"
    - "JSTOR"
    - "Project MUSE"
    - "Google Scholar used as discovery rather than authority"
    - "Crossref/citation chaining"
    - "WorldCat/library catalogues for monographs and editions"
  psychology_social_science_routes:
    - "PsycINFO or equivalent psychology index where accessible"
    - "Crossref/Google Scholar citation chaining for bereavement, hallucination/apparitional experience, memory, social influence, and group-report formation"
  philosophy_routes:
    - "PhilPapers or equivalent philosophy index where accessible"
    - "JSTOR/Project MUSE/Crossref"
  archaeology_history_routes:
    - "discipline-specific bibliographies, archaeological reports, classical/Jewish history indexes, and citation trails"
  access_note: "Naming a repository is a planned search route, not a claim of current access. Inaccessibility is recorded under the frozen rule below."

global_search_rules:
  - "Search by proposition/candidate mechanism, not by desired conclusion."
  - "For each candidate-native search, run a paired adverse/critical search."
  - "Search source dependence and provenance separately from theological interpretation."
  - "Use backward and forward citation chaining on outcome-material works."
  - "Do not treat canonical/noncanonical, confessional/skeptical, early/late, or prestigious/marginal labels as quality scores."
  - "Repeated dependent sources count as one evidential stream for convergence."
  - "Later formulation sources may define a candidate without becoming early evidence."
  - "Record failed searches, inaccessible sources, and expected-but-absent evidence symmetrically."

