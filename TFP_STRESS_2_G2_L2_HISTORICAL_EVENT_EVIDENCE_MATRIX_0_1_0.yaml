source_clusters:
  H1_CASE_PRIMARY_DEATH_REPORTS:
    source_ids: ["G1W1-001","G1W1-009","G1W1-015","G1W1-019","G1W1-020","G1W1-021","G1W1-022","G1W1-023","G1W1-024","G1W1-025"]
    observations:
      - "Multiple first-century Christian sources narrate or proclaim Jesus's execution/death; Tacitus independently records Christus's execution under Pontius Pilate."
      - "The Gospel narratives contain explicit death language and burial sequences; John additionally narrates soldiers treating Jesus as already dead and a spear wound."
    limits:
      - "Literary multiplicity is not full independence; Synoptic/Acts/Johannine source relationships remain controlled."
      - "Textual attestation of death is not by itself a medical finding."
  H2_ROMAN_CRUCIFIXION_MEDICAL:
    source_ids: ["G1W1-012","G1W1-026","G1W1-027","G1W1-036","G1W1-037","G1W1-042","G1W1-043"]
    observations:
      - "Josephus documents crucifixion practice and one survivor among three acquaintances removed from crosses and medically treated."
      - "Archaeology independently attests Roman-period crucifixion in Jerusalem."
      - "Modern medical reviews disagree on a universal physiological mechanism but treat crucifixion as a potentially fatal execution process; one survey argues the Jesus case ended in death."
    limits:
      - "General Roman practice and medical mechanisms require case-specific transfer."
      - "Josephus Life 420-421 exact Niese Greek remains unextracted."
      - "Mechanism uncertainty is not survival evidence."
  H3_SURVIVAL_NONDEATH:
    source_ids: ["G1RS-064","G1W1-012","G1W1-026","G1W1-042","G1W1-043"]
    observations:
      - "Lloyd Davies & Lloyd Davies explicitly argue a shock/unconsciousness-and-recovery hypothesis for Jesus."
      - "Josephus supplies an ancient real survival case after removal and treatment."
      - "Paired medical literature disputes or qualifies nondeath while acknowledging uncertainty over universal crucifixion physiology."
    limits:
      - "The survival hypothesis depends on contested Gospel-historical and medical assumptions."
      - "A demonstrated survival possibility does not establish survival in the target case."
  H4_BURIAL_BODY_DISPOSITION:
    source_ids: ["G1W1-015","G1W1-019","G1W1-020","G1W1-021","G1W1-027","G1RS-055","G1RS-056","G1RS-071"]
    observations:
      - "Canonical narratives describe Joseph-associated burial and tomb placement."
      - "Josephus and archaeology document Jewish burial concern/customs and at least one crucified Jerusalem individual receiving burial."
      - "Crossan supplies an adverse nonburial/dishonorable-disposal reconstruction grounded in Roman practice and narrative-development arguments."
    limits:
      - "General Jewish burial norms do not prove Jesus's burial."
      - "Crossan pp.123-158 was not read continuously."
      - "Generic R-TRANS, V, H, L, and C-HET remain body-disposition neutral under the frozen G0 architecture."
  H5_FOUNDING_CHRONOLOGY:
    source_ids: ["G1W1-001","G1W1-002","G1W1-003","G1W1-008","G1W1-030","G1W1-031","G1W1-032","G1W1-033"]
    observations:
      - "Paul provides the earliest acquired author-level proclamation network and explicitly says he received and delivered tradition."
      - "Source-critical controls cover Pauline chronology, formula boundaries, Synoptic dependence, Acts speeches, and Johannine composition."
    limits:
      - "Several chronology/dependence controls are abstract/reference-entry level."
      - "Exact pre-Pauline formula boundaries remain disputed."
  H6_FABRICATION_IMPLEMENTATION:
    source_ids: ["G1W1-019","G1RS-063","G1RS-071","G1RS-055","G1RS-056"]
    observations:
      - "Matthew contains the stolen-body counterclaim tradition."
      - "Crossan argues for invention/development of honorable burial/Joseph traditions but does not itself establish actor-specific founding knowing falsehood."
      - "Modern deception scholarship warns against inferring lying from generic cues."
      - "Burial/body evidence can bear only on the preregistered F-BODY-REMOVAL implementation, while F-NONBODY-ASSERTION requires an independent actor/opportunity route."
    limits:
      - "No acquired first-century evidence directly establishes a founding actor knowingly fabricating the resurrection/encounter proclamation."
      - "Motive/opportunity cannot be inferred from theological interest or group benefit alone."
  H7_MODULE_TIMING_CONTEXT:
    source_ids: ["G1W1-001","G1W1-008","G1RS-059","G1RS-060","G1RS-061","G1RS-062","G1RS-070"]
    observations:
      - "The corpus supplies early proclamation content, modern mechanism capacities, social-memory controls, and later narrative-development evidence."
      - "Historical timing is separable from psychological mechanism capacity; later narrative material is not founding-stratum mechanism evidence."
    limits:
      - "L2 can constrain stratum/timing but cannot establish subjective mechanism operation or causal-role vectors assigned to L3/L4/L6."

