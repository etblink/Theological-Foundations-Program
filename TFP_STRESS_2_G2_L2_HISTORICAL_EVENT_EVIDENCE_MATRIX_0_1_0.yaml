matrix_constraints:
  - "The matrix binds historical-event and chronology evidence to frozen proposition surfaces but assigns no proposition disposition."
  - "P-DEATH and P-S1-NONDEATH are treated symmetrically; survival possibility is not target-case survival, and mechanism uncertainty is not death denial."
  - "Burial/body-disposition evidence is used only on frozen eligible routes; it cannot support or weaken generic R-TRANS, V, H, L, or C-HET."
  - "General Roman execution and Jewish burial practices require explicit target-case transfer."
  - "Historical attestation is separated from medical inference."
  - "No fabrication proposition is supported merely because a later tradition appears developed."
  - "C-HET module timing can be constrained here, but mechanism occurrence/causal necessity cannot be borrowed from modern analogies."

