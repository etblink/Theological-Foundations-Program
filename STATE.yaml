  canonical_mutable_state: "STATE.yaml"
  global_truth_adjudication_reached: false

authority:
  human_owner_final_authority:
    - "program_purpose"
    - "authorize_bounded_truth_adjudication_at_G0"
    - "major_scope_changes"
    - "accept_canonical_theological_adjudication_at_G5"
    - "qualify_adjudication_protocol_after_required_audit"
    - "consequential_program_level_truth_commitments"
    - "governance_changes_that_alter_authority_boundaries"
  research_agents_may:
    - "execute_authorized_research"
    - "create_frozen_research_artifacts"
    - "propose_dispositions"
    - "update_state_within_already_authorized_scope"
  research_agents_may_not_silently:
    - "redefine_governing_aim"
    - "authorize_new_major_theological_program"
    - "promote_local_result_to_global_truth_commitment"
    - "erase_negative_knowledge"
    - "reopen_held_work_without_condition_or_authorization"

current_scope:
  id: "TFP-METHOD-REAUDIT-0.1.2"
  status: "reaudit_ready"
  purpose: "Obtain an independent focused qualification re-audit of candidate Protocol 0.1.2."
  bounded: true
  repair_branch: "repair/tfp-adjudication-protocol-0.1.2"
  repair_candidate: "TFP_ADJUDICATION_PROTOCOL_0_1_2.md"
  repair_preregistration: "TFP_ADJUDICATION_PROTOCOL_0_1_2_REPAIR_PREREGISTRATION.md"
  repair_compliance_matrix: "TFP_ADJUDICATION_PROTOCOL_0_1_2_REPAIR_COMPLIANCE_MATRIX.md"

next_action:
  id: "TFP-METHOD-REAUDIT-0.1.2"
  action: "launch_focused_independent_reaudit"
  target_artifact: "TFP_ADJUDICATION_PROTOCOL_0_1_2_FOCUSED_REAUDIT_REPORT.md"
  launch_prompt: "TFP_ADJUDICATION_PROTOCOL_0_1_2_FOCUSED_REAUDIT_PROMPT.md"
  requirements:
    - "strict_independent_auditor"
    - "auditor_does_not_read_prior_audits_or_repair_control_artifacts"
    - "audit_governed_source_set_only"
    - "no_repair_or_stress_test_during_audit"

canonical_adjudications: []

methodology:
  claim_typing_required: true
  link_decomposition_required: true
  preregistration_for_complex_studies: true
  equal_standard_required: true
  negative_results_first_class: true
  candidate_completeness_gate: true
  independent_reinvention_null_required_when_applicable: true
  no_opaque_global_score: true
  continuity_framework:
    C0: "recurrence_only"
    C1: "material_continuity"
    C2: "carrier_continuity"
    C3: "ritual_or_practice_continuity"
    C4: "semantic_continuity"
    C5: "named_textual_continuity"
    C6: "genealogical_continuity"
    C7: "doctrinal_continuity"

investigations:
  EMT:
    name: "Environmental–Monumental–Theological Development Hypothesis"
    status: "stage_1_complete"
    stage_1_synthesis: "EMT_STAGE_1_SYNTHESIS_AND_ROUTING_0_1_0.md"
    original_hypothesis: "EMT_HYPOTHESIS_PREREGISTRATION_0_1_0.md"
    dispositions:
      original_continuous_genealogy: "not_established"
      broad_environment_to_theology_transformation: "partially_supported_to_strong"
      hydrological_substitution_D_EMT_2: "partially_supported"
      lightning_specific_monument_bridge: "not_established"
      broad_sahara_nile_bridge: "supported"
      direct_nabta_to_pyramid_genealogy: "not_established"
    status_rule: "held_after_stage_1"
    reopen_if:
      - "new_reproducible_Drumm_or_ISIDA_material_data_with_traceable_provenance"
      - "secure_early_Northeast_African_lightning_associated_archaeological_context"
      - "material_new_evidence_for_symbolic_transmission_across_Western_Desert_Badarian_Naqada"
      - "credible_independent_audit_challenges_a_stage_1_disposition"
      - "later_TFP_study_requires_a_bounded_EMT_result"

held:
  - id: "EMT-STAGE-2"
    reason: "Stage 1 reached a useful bounded closure; further expansion is conditional."
  - id: "MAJOR-DOCTRINAL-COMPARISON"
    reason: "Adjudication protocol not yet formalized or stress-tested."

external_boundaries:
  ISR:
    status: "parked"
    comparison_with_TFP: "suspended_during_TFP_independence_interval"

