schema_version: "0.2.0"
updated_at: "2026-10-05"

program:
  name: "Theological Foundations Program"
  status: "active"
  ultimate_aim: "truth_adjudication"
  governing_charter: "TFP_PROGRAM_CHARTER_0_1_1.md"
  governance: "GOVERNANCE.md"
  current_method: "TFP_METHOD_SEED_0_1_0.md"
  qualified_protocol: null
  candidate_protocol: "repair/tfp-adjudication-protocol-0.1.4:TFP_ADJUDICATION_PROTOCOL_0_1_4.md"
  candidate_governance_version: "0.1.3"
  candidate_protocol_status: "CANDIDATE__REPAIR_PENDING_REAUDIT"
  canonical_mutable_state: "STATE.yaml"
  canonical_branch: "main"
  global_truth_adjudication_reached: false

authority:
  human_owner_final_authority:
    - "program_purpose"
    - "authorize_bounded_truth_adjudication_at_G0"
    - "major_scope_changes"
    - "accept_canonical_theological_adjudication_at_G5"
    - "qualify_adjudication_protocol_after_required_audit"
    - "ratify_governance_changes_that_alter_authority_boundaries"
    - "consequential_program_level_truth_commitments"
  research_agents_may:
    - "execute_authorized_research"
    - "create_frozen_research_artifacts"
    - "propose_dispositions"
    - "update_state_within_already_authorized_scope"
    - "mechanically_record_a_human_accepted_adjudication"
  research_agents_may_not_silently:
    - "redefine_governing_aim"
    - "authorize_new_truth_adjudication"
    - "promote_local_result_to_global_truth_commitment"
    - "erase_negative_knowledge"
    - "reopen_held_work_without_condition_or_authorization"

current_scope:
  id: "TFP-METHOD-REAUDIT-0.1.4"
  status: "reaudit_ready"
  purpose: "Run a strict independent qualification re-audit against the immutable governed-source bundle named by the qualification source manifest."
  bounded: true
  repair_branch: "repair/tfp-adjudication-protocol-0.1.4"
  candidate_protocol: "TFP_ADJUDICATION_PROTOCOL_0_1_4.md"
  candidate_governance: "GOVERNANCE.md"
  repair_preregistration: "TFP_ADJUDICATION_PROTOCOL_0_1_4_REPAIR_PREREGISTRATION.md"
  repair_compliance_matrix: "TFP_ADJUDICATION_PROTOCOL_0_1_4_REPAIR_COMPLIANCE_MATRIX.md"
  qualification_source_manifest: "TFP_PROTOCOL_QUALIFICATION_SOURCE_MANIFEST_0_1_4.yaml"
  launch_prompt: "TFP_ADJUDICATION_PROTOCOL_0_1_4_STRICT_QUALIFICATION_REAUDIT_PROMPT.md"

next_action:
  id: "TFP-METHOD-REAUDIT-0.1.4"
  action: "launch_strict_independent_qualification_reaudit"
  target_artifact: "TFP_ADJUDICATION_PROTOCOL_0_1_4_STRICT_QUALIFICATION_REAUDIT_REPORT.md"
  launch_prompt: "TFP_ADJUDICATION_PROTOCOL_0_1_4_STRICT_QUALIFICATION_REAUDIT_PROMPT.md"
  source_manifest: "TFP_PROTOCOL_QUALIFICATION_SOURCE_MANIFEST_0_1_4.yaml"
  requirements:
    - "audit_exact_manifest_pinned_bundle"
    - "strict_auditor_disjoint_from_authors_and_outcome_material_reviewers"
    - "auditor_does_not_read_prior_audits_or_repair_control_artifacts"
    - "no_repair_qualification_or_stress_test_during_audit"

canonical_adjudications: []

methodology:
  claim_typing_required: true
  link_decomposition_required: true
  preregistration_for_complex_studies: true
  equal_standard_required: true
  negative_results_first_class: true
  candidate_completeness_gate: true
  independent_reinvention_null_required_when_applicable: true
  no_opaque_global_score: true
  continuity_framework:
    C0: "recurrence_only"
    C1: "material_continuity"
    C2: "carrier_continuity"
    C3: "ritual_or_practice_continuity"
    C4: "semantic_continuity"
    C5: "named_textual_continuity"
    C6: "genealogical_continuity"
    C7: "doctrinal_continuity"

roles:
  human_owner:
    id: "HUMAN_OWNER"
    authority:
      - "G0_authorization"
      - "G5_acceptance"
      - "protocol_qualification"
      - "governance_authority_ratification"
  program_lead:
    id: "OPENAI_CHATGPT_TFP_PROGRAM_LEAD_LINEAGE"
    description: "current OpenAI ChatGPT TFP project-lead conversation lineage"
    may_not_serve_as_strict_auditor_for_same_cycle: true

protocol_qualification_candidate:
  version: "0.1.4"
  protocol_path: "TFP_ADJUDICATION_PROTOCOL_0_1_4.md"
  governance_version: "0.1.3"
  governance_path: "GOVERNANCE.md"
  source_manifest: "TFP_PROTOCOL_QUALIFICATION_SOURCE_MANIFEST_0_1_4.yaml"
  audited_bundle_identity_rule: "must_match_external_source_manifest_exactly"
  status: "READY_FOR_PINNED_AUDIT"
  qualified: false
  human_owner_material_authorship:
    protocol: false
    candidate_governance_amendment: false
  program_lead_material_authorship:
    protocol: true
    candidate_governance_amendment: true
  human_owner_outcome_material_qualification_reviewer: false
  governance_owner_ratification: "PENDING_FINAL_QUALIFICATION_ACCEPTANCE"
  strict_audits_required: 1
  qualification_role_matrix:
    protocol_authors:
      - "OPENAI_CHATGPT_TFP_PROGRAM_LEAD_LINEAGE"
    governance_amendment_authors:
      - "OPENAI_CHATGPT_TFP_PROGRAM_LEAD_LINEAGE"
    outcome_material_qualification_reviewers: []
    program_lead: "OPENAI_CHATGPT_TFP_PROGRAM_LEAD_LINEAGE"
    strict_auditor: "TO_BE_ASSIGNED_FRESH_DISJOINT_LINEAGE"
    required_disjointness:
      - "not_protocol_author"
      - "not_governance_amendment_author"
      - "not_program_lead_for_repair_cycle"
      - "not_outcome_material_qualification_reviewer"
  carried_limitations:
    - "SUPPORTED_WITHIN_SCOPE_retains_disciplined_expert_judgment_only_inside_documented_sufficiency_steps"
    - "metaphysical_and_revelation_questions_may_legitimately_remain_FRAMEWORK_DEPENDENCE"
    - "AI_session_model_independence_is_procedural_not_guaranteed_training_prior_independence"

protocol_qualification_schema:
  authoritative_field: "qualified_protocol"
  required_fields:
    - "version"
    - "protocol_path"
    - "protocol_blob_sha"
    - "governed_bundle_commit"
    - "source_manifest"
    - "governance_version"
    - "governance_blob_sha"
    - "charter_blob_sha"
    - "method_seed_blob_sha"
    - "audited_state_blob_sha"
    - "audit_artifacts"
    - "audit_dispositions"
    - "human_owner_acceptance_artifact"
    - "governance_ratification_artifact"
    - "qualified_at"
    - "limitations"
    - "status"
    - "reopen_if"

canonical_adjudication_schema:
  required_fields:
    - "id"
    - "question"
    - "outcome"
    - "scope"
    - "protocol_version"
    - "accepted_at"
    - "synthesis_artifact"
    - "audit_artifacts"
    - "human_acceptance_artifact"
    - "confidence"
    - "evidence_coverage"
    - "background_assumptions"
    - "residual_alternatives"
    - "known_weaknesses"
    - "flip_or_weaken_conditions"
    - "underdetermination_subtype"
    - "limitations"
    - "negative_knowledge"
    - "reopen_if"

