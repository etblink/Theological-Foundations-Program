  governing_charter: "TFP_PROGRAM_CHARTER_0_1_1.md"
  governance: "GOVERNANCE.md"
  current_method: "TFP_METHOD_SEED_0_1_0.md"
  adjudication_protocol: null
  qualified_protocol: null
