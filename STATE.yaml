  - "STATE.yaml is the sole canonical mutable project-state file."
  - "README is orientation, not authority."
  - "Evidence does not automatically become synthesis."
  - "Synthesis does not automatically become adjudication."
  - "Adjudication does not automatically become authorization."
  - "Local findings do not automatically become global theological truth commitments."
  - "Negative knowledge is preserved."
  - "Closed or held work reopens only by condition or authorization."

