    claim: "lightning-associated stone placement is established as an ancestor of Egyptian monumental architecture"
    status: "not_established"
    scope: "EMT Stage 1"
    reopen_if:
      - "secure archaeologically contextualized evidence"
      - "independent replication of relevant material claims"
  - id: "NK-EMT-002"
    claim: "a direct Nabta Playa to pyramid engineering genealogy is established"
    status: "not_established"
    scope: "EMT Stage 1"
    reopen_if:
      - "new intermediate continuity evidence"
  - id: "NK-EMT-003"
    claim: "Geoffrey Drumm's pyramid chemical/lightning functional model is empirically validated"
    status: "not_established"
    scope: "publicly accessible evidence reviewed in EMT Stage 1"
    reopen_if:
      - "raw analytical data"
      - "traceable sample provenance"
      - "independent replication"

