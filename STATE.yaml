  method_status: "active_candidate"
  adjudication_protocol_status: "no_qualified_protocol__candidate_0_1_3_reaudit_required"
  focused_reaudit_report: "TFP_ADJUDICATION_PROTOCOL_0_1_1_FOCUSED_REAUDIT_REPORT.md"
  focused_reaudit_disposition: "TFP_ADJUDICATION_PROTOCOL_0_1_1_REAUDIT_DISPOSITION_0_1_0.md"
