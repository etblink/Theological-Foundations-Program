  - id: "MAJOR-DOCTRINAL-COMPARISON"
    reason: "No adjudication protocol is yet qualified."
  - id: "TFP-STRESS-2"
    candidate: "resurrection_claim"
    reason: "Protocol qualification is a prerequisite and does not itself authorize the study."

external_boundaries:
  ISR:
    status: "parked"
    comparison_with_TFP: "suspended_during_TFP_independence_interval"

